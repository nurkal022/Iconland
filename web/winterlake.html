<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconland · Winter Lake</title>
<!--
  Iconland · Winter Lake theme (a frozen lake seen from straight above; WebGL2, one full-screen pass)
  - Melt field (CPU, only when icons change): gaussian metaballs + noise warp -> signed distance s to the edge of the
    open water (<0 = a pool the icons have melted, >0 = ice). Two channels: clamped near the edge (so the edge moves
    evenly while a pool freezes over or thaws) and unclamped (how far out on the ice a point is).
  - Ice: washes of frosted and clear dark ice, wind-blown snow drifts with soft shadows; cracks, trapped bubbles and
    old scratches are drawn once per seed into a detail texture (2D canvas in CSS pixels, independent of the canvas scale).
  - Around a pool: wet ice, thin see-through ice, floes, steam, the submerged shelf, a lit ice wall and its shadow.
  - Memory (CPU, CSS pixels): skate traces and the cracks that shoot out of a thawing pool are drawn into an RG8
    buffer that fades slowly; "new ice" (where a pool was a moment ago) lives on the field grid and frosts over.
  - Life: skaters (steered on the CPU, drawn as small SDF figures with long shadows), a snowman and an ice fisherman
    that move elsewhere when the icons come too close, snowfall.
  Debug: ?nocap (no 30 fps cap), ?lifetest (everything on stage right away), ?falltest (a skater falls in).
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3ef; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* preview mode (?preview=1, settings window): translucent boxes show where the real icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.55); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #234; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="nogl">WebGL2 is not available.</div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 0;
const STEP = 5;
const MORPH_MS = 2600;
const WARP = 38;                         // how much the pool outline is bent by noise (px)
const S_CLAMP = 60, D_CLAMP = 220;       // edge channel clamp / distance channel clamp (px)

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');        // real desktop: messages from the host
const PREVIEW = QS.has('preview');       // settings window preview (iframe): messages from the parent page
const LIFETEST = QS.has('lifetest');     // debug: skaters, snowman and fisherman on stage right away
const FALLTEST = QS.has('falltest');     // debug: a skater falls through the ice about 3.5 s after the icons arrive
// Defaults must match themes.json
const P = {
  sigma: 72,        // size of the melted pool around the icons (px)
  skaters: 5,       // how many people skate
  snowfall: 0.5,    // falling snow
  cover: 0.5,       // how much of the ice is covered by snow drifts
  extras: 1,        // snowman and ice fisherman: 0 hide, 1 show
  cracks: 0.3,      // how cracked the ice is
  speed: 1,         // animation speed
  quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
if (QS.has('nocap')) P.cap30 = false;    // debug: the reported fps is the real one
const KEYS = { sigma: [40, 200], skaters: [0, 10], snowfall: [0, 1], cover: [0, 1], extras: [0, 1], cracks: [0, 1], speed: [0, 3] };

/* ======================================================================
   Random / noise helpers (CPU)
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
// Tileable noise texture (fixed): 4 channels of fbm at different scales
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const h = (a, b) => { let v = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(k, 2246822519); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  const a = h(x0, y0), b = h(x1, y0), c = h(x0, y1), d = h(x1, y1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[4, 8, 16, 32], [8, 16, 32, 64], [2, 4, 8, 16], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let s = 0, w = 0.5, tw = 0;
      for (let j = 0; j < chans[c].length; j++) { const p = chans[c][j]; s += w * tileNoise(u * p, v * p, p, p, 100 + c * 50 + j * 13); tw += w; w *= 0.5; }
      d[i + c] = Math.min(Math.max((s / tw - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
// small seeded generator for everything that is drawn once per seed
function rng32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ======================================================================
   Melt field (CPU): s = signed distance to the edge of the open water (<0 pool around icons, >0 ice)
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}
let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = WARP * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const Rf = sig * Math.min(5.5, 300 / sig + 1.1), Rf2 = Rf * Rf;       // far enough for the distance channel
    const R = Rf + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      const d2 = dx * dx + dy * dy;
      if (d2 < Rf2) f1[i] += Math.exp(-d2 * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-60);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = Math.min(D_CLAMP, sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0));
  }
  fieldMs = performance.now() - t0;
  return { s };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ======================================================================
   Shaders
   ====================================================================== */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB, uDet, uMark, uScar;
uniform vec2 uRes, uGrid;
uniform float uScale, uSeed, uStep, uMix, uTime, uCover, uSnow, uRim;
uniform vec4 uSk[10];            // skaters: x, y, heading, stride phase
uniform vec4 uSkB[10];           // size (0 = none), kind + colour hash, -, alpha
uniform vec4 uProp[2];           // snowman, fisherman: x, y, facing, alpha
uniform vec4 uFall[2];           // someone fell through the ice: x, y, seconds since (<0 = none), colour hash
out vec4 o;

const vec2 SHDIR = vec2(0.58, 0.81);          // shadows fall to the lower right: a low winter sun in the upper left
const vec2 WIND = vec2(0.985, 0.171);         // the wind that laid the snow drifts and carries the snowflakes
const vec2 WINDP = vec2(-0.171, 0.985);
const vec3 SHADE = vec3(0.60, 0.70, 0.86);    // shadow tint on snow and ice
const vec3 SHADOW = vec3(0.47, 0.60, 0.82);   // the long shadows of people and things
const float SHK = 54.0;                       // length of a standing adult's shadow (px)
const vec3 PAL[9] = vec3[9](vec3(0.86, 0.20, 0.20), vec3(0.95, 0.52, 0.13), vec3(0.97, 0.80, 0.24), vec3(0.14, 0.56, 0.58),
  vec3(0.20, 0.38, 0.78), vec3(0.56, 0.30, 0.70), vec3(0.93, 0.44, 0.62), vec3(0.24, 0.60, 0.34), vec3(0.93, 0.93, 0.90));

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
vec2 field(vec2 p) {
  vec2 uv = (p / uStep + 0.5) / uGrid;
  return mix(texture(uFA, uv).rg, texture(uFB, uv).rg, uMix);
}
// distance to the pool edge that stays continuous while the clamped and unclamped channels cross-fade
float sdist(vec2 f) { return min(f.y, f.x + ss(40.0, 59.0, f.x) * max(f.y - f.x, 0.0)); }
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }
float segT(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); }
float ellD(vec2 p, vec2 r) { return (length(p / r) - 1.0) * min(r.x, r.y); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }

// height of the wind-blown snow: long streaks along the wind
float snowH(vec2 pw) {
  vec2 q = pw * vec2(0.5, 1.0);
  return N(q, 1500.0).r * 0.62 + N(q + 431.0, 600.0).g * 0.38;
}

// ---- small floes drifting at the edge of a pool: one at most per cell ----
vec4 floes(vec2 p, out float skirt) {
  const float FG = 28.0;
  skirt = 0.0;
  vec4 res = vec4(0.0);
  vec2 c0 = floor(p / FG);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = c0 + vec2(i, j);
    float h = hash2(c + 0.61);
    if (h > 0.58) continue;
    vec2 ctr = (c + 0.5 + (vec2(hash2(c + 1.7), hash2(c + 2.9)) - 0.5) * 0.62) * FG;
    ctr += vec2(sin(uTime * 0.23 + h * 40.0), cos(uTime * 0.19 + h * 30.0)) * 2.4;
    vec2 dv = p - ctr;
    if (dot(dv, dv) > 230.0) continue;
    float sc = sdist(field(ctr));
    float g = ss(-uRim - 6.0, -uRim * 0.6, sc) * ss(-2.0, -7.0, sc);       // only in the rim band of the pool
    if (g <= 0.03) continue;
    float R = (3.4 + 6.2 * hash2(c + 3.3)) * (0.45 + 0.55 * g) * min(1.0, uRim / 34.0);
    vec2 q = rot(hash2(c + 5.1) * 6.283 + sin(uTime * 0.11 + h * 20.0) * 0.3) * dv;
    // a chunky polygon: five cuts at uneven distances
    float dd = -1e9;
    for (int k = 0; k < 5; k++) {
      float a = (float(k) + 0.6 * hash2(c + float(k) * 3.1 + 7.0)) * 1.2566;
      dd = max(dd, dot(q, vec2(cos(a), sin(a))) - R * (0.72 + 0.28 * hash2(c + float(k) * 5.3 + 9.0)));
    }
    skirt = max(skirt, ss(4.5, 0.0, dd) * g);
    float m = ss(0.6, -0.6, dd * uScale) * ss(0.03, 0.3, g);
    if (m <= 0.0) continue;
    vec3 fc = mix(vec3(0.90, 0.955, 0.99), vec3(0.76, 0.88, 0.95), hash2(c + 8.1));
    fc = mix(fc, vec3(0.58, 0.75, 0.88), ss(-0.2, 1.0, dot(dv / R, SHDIR)) * 0.6);    // shaded far side
    fc = mix(fc, vec3(0.50, 0.70, 0.84), ss(-1.8, 0.0, dd) * 0.55);                     // painted edge
    res = vec4(mix(res.rgb, fc, m), max(res.a, m));
  }
  return res;
}

// ---- skater seen from above (local px, forward = +x). kind: 0 adult, 1 kid, 2 / 3 a pair holding hands ----
void skaterPose(float ph, float kind, out vec2 fl, out vec2 fr, out vec2 hl, out vec2 hr) {
  float sw = sin(ph);
  bool kid = kind > 0.5 && kind < 1.5;
  float st = kid ? 2.4 : 4.2;                                      // stride
  fl = vec2(st * sw - 0.5, 3.0 + 1.6 * max(-sw, 0.0));             // the pushing foot goes back and out to the side
  fr = vec2(-st * sw - 0.5, -3.0 - 1.6 * max(sw, 0.0));
  hl = vec2(-4.4 * sw + 0.9, 6.9);                                 // arms swing against the legs
  hr = vec2(4.4 * sw + 0.9, -6.9);
  if (kid) { hl = vec2(0.6 + 1.3 * sin(ph * 2.3), 10.0); hr = vec2(0.6 - 1.3 * sin(ph * 2.3 + 1.0), -10.0); }   // arms out for balance
  if (kind > 1.5 && kind < 2.5) hl = vec2(0.4, 9.2);               // holding the partner's hand
  if (kind > 2.5 && kind < 3.5) hr = vec2(0.4, -9.2);
  if (kind > 3.5) { hl = vec2(-2.0 + 3.0 * sin(ph * 3.1), 9.6); hr = vec2(-2.0 - 3.0 * sin(ph * 3.1 + 0.8), -9.6); }   // braking: arms flail
}
vec4 skater(vec2 q, float ph, float kind, float hue, vec2 lightL, float aa) {
  vec2 fl, fr, hl, hr;
  skaterPose(ph, kind, fl, fr, hl, hr);
  vec3 jac = PAL[int(fract(hue * 7.13) * 9.0)], hat = PAL[int(fract(hue * 13.7 + 0.3) * 9.0)], scf = PAL[int(fract(hue * 29.3 + 0.7) * 9.0)];
  vec3 trs = fract(hue * 3.7) < 0.5 ? vec3(0.13, 0.17, 0.30) : vec3(0.22, 0.21, 0.24);
  vec3 col = vec3(0.0); float a = 0.0, m;
  // legs and skates
  m = ss(aa, -aa, min(segD(q, vec2(-0.6, 2.2), fl), segD(q, vec2(-0.6, -2.2), fr)) - 1.6);
  col = mix(col, trs, m); a = max(a, m);
  m = ss(aa, -aa, min(segD(q, fl + vec2(-2.4, 0.0), fl + vec2(3.0, 0.0)), segD(q, fr + vec2(-2.4, 0.0), fr + vec2(3.0, 0.0))) - 1.1);
  col = mix(col, vec3(0.11, 0.11, 0.13), m); a = max(a, m);
  // arms and mittens
  m = ss(aa, -aa, min(segD(q, vec2(0.4, 5.0), hl), segD(q, vec2(0.4, -5.0), hr)) - 1.45);
  col = mix(col, jac * 0.84, m); a = max(a, m);
  m = ss(aa, -aa, min(length(q - hl), length(q - hr)) - 1.6);
  col = mix(col, scf, m); a = max(a, m);
  // shoulders
  vec2 tq = (q - vec2(0.2, 0.0)) / vec2(3.5, 6.3);
  float dT = (length(tq) - 1.0) * 3.5;
  vec3 tc = jac * (0.86 + 0.26 * ss(-0.7, 0.8, dot(tq, lightL)));
  tc = mix(tc, jac * 0.60, ss(-1.3, -0.1, dT) * 0.6);                    // painted rim
  m = ss(aa, -aa, dT); col = mix(col, tc, m); a = max(a, m);
  // scarf streaming behind
  vec2 s0 = vec2(-1.2, 1.6), s1 = vec2(-7.6, 2.6 + 1.5 * sin(ph * 1.7 + hue * 30.0));
  m = ss(aa, -aa, segD(q, s0, s1) - mix(1.4, 0.7, segT(q, s0, s1)));
  col = mix(col, scf * 0.92, m); a = max(a, m);
  // head: a woolly hat with a pom-pom
  vec2 hq = q - vec2(1.9, 0.0);
  float dH = length(hq) - 3.2;
  vec3 hc = hat * (0.88 + 0.24 * ss(-0.8, 0.8, dot(hq / 3.2, lightL)));
  hc = mix(hc, hat * 0.58, ss(-1.1, -0.1, dH) * 0.6);
  hc = mix(hc, mix(hat, vec3(1.0), 0.75), ss(aa, -aa, length(hq + vec2(0.5, 0.0)) - 1.25));
  m = ss(aa, -aa, dH); col = mix(col, hc, m); a = max(a, m);
  return vec4(col, a);
}
// the long shadow shows the whole figure: legs, body, arms, head (sh: shadow offset per px of height, local frame)
float skaterShadow(vec2 q, vec2 sh, float ph, float kind) {
  vec2 fl, fr, hl, hr;
  skaterPose(ph, kind, fl, fr, hl, hr);
  vec2 hip = sh * 24.0, shd = vec2(0.4, 0.0) + sh * 39.0, head = vec2(1.6, 0.0) + sh * 44.5;
  float d = min(segD(q, fl, hip + vec2(0.0, 1.8)), segD(q, fr, hip - vec2(0.0, 1.8))) - 1.5;
  d = min(d, segD(q, hip, shd) - 3.3);
  d = min(d, min(segD(q, shd + vec2(0.0, 4.8), hl + sh * 24.0), segD(q, shd - vec2(0.0, 4.8), hr + sh * 24.0)) - 1.3);
  d = min(d, length(q - head) - 3.2);
  return d;
}

// ---- snowman (screen-aligned px; face = the way the carrot points). Drawn leaning a touch "up" the screen,
//      as from a high window rather than from straight above, so the three balls read as a stack ----
vec4 snowman(vec2 q, float face, float aa) {
  vec2 fd = vec2(cos(face), sin(face)), sd = vec2(-fd.y, fd.x);
  const vec3 SN = vec3(0.955, 0.975, 1.0), SS = vec3(0.66, 0.77, 0.92);
  vec3 col = vec3(0.0), c; float a = 0.0, m;
  vec2 q2 = q - vec2(0.4, -4.2), hq = q - vec2(0.7, -8.0) - fd * 0.6;
  float d1 = length(q) - 11.5, d2 = length(q2) - 8.4, d3 = length(hq) - 5.8;
  // bottom ball: lit from the upper left, blue on the far side, the middle ball's shadow on it
  c = mix(SN, SS, ss(-0.3, 1.1, dot(q / 11.5, SHDIR)) * 0.9);
  c = mix(c, SS * 0.9, ss(3.5, -1.0, length(q2 - SHDIR * 3.2) - 8.4) * 0.65);
  c = mix(c, SS * 0.78, ss(-1.5, 0.0, d1) * 0.6);
  m = ss(aa, -aa, d1); col = mix(col, c, m); a = max(a, m);
  // stick arms
  float dA = min(segD(q2, sd * 6.5 + fd, sd * 17.5 + fd * 4.0), segD(q2, -sd * 6.5 + fd, -sd * 17.0 + fd * 2.5));

// ---- ice fisherman seen from above (local px; he faces +x, the hole is in front of him) ----
vec4 fisher(vec2 q, float t, vec2 lightL, float aa) {

  c = mix(vec3(0.93, 0.97, 1.0), vec3(0.72, 0.83, 0.94), ss(-0.6, 0.9, dot(hq / 9.0, lightL * -1.0)) * 0.7);

  c *= 1.0 + 0.5 * (1.0 - ss(0.0, 0.8, abs(hl - 2.6 - 1.2 * fract(t * 0.35)))) * (1.0 - fract(t * 0.35));       // a ripple from the float

  c = mix(c, vec3(1.0), ss(aa, -aa, length(fq + vec2(0.35)) - 0.55));
  m = ss(aa, -aa, hl - 6.0); col = mix(col, c, m);

  col = mix(col, vec3(0.52, 0.35, 0.19), m); a = max(a, m);
  // legs and boots

  col = mix(col, vec3(0.22, 0.27, 0.22), m); a = max(a, m);

  col = mix(col, vec3(0.13, 0.11, 0.10), m); a = max(a, m);

  col = mix(col, vec3(0.23, 0.16, 0.10), m); a = max(a, m);
  m = ss(aa, -aa, segD(q, tip, vec2(25.5 + bob * 0.3, 0.3)) - 0.22) * 0.75;
  col = mix(col, vec3(0.94, 0.96, 0.98), m); a = max(a, m);
  // arms reach forward to the rod
  const vec3 PARKA = vec3(0.80, 0.52, 0.14);
  m = ss(aa, -aa, min(segD(q, vec2(0.6, 5.6), vec2(7.6, 1.3)), segD(q, vec2(0.6, -5.6), vec2(7.6, -1.3))) - 1.6);
  col = mix(col, PARKA * 0.84, m); a = max(a, m);
  m = ss(aa, -aa, min(length(q - vec2(7.8, 1.3)), length(q - vec2(7.8, -1.3))) - 1.6);

float fisherShadow(vec2 q, vec2 sh) {

// ---- someone has fallen through the ice at the rim of a pool. Small and brief: a splash, ripple rings, head and
//      shoulders with waving arms, a couple of bobs, then under with bubbles; the hat stays afloat for a while ----
vec3 drawFall(vec3 col, vec2 p, vec4 f) {
  float t = f.z;
  vec2 q = (p - f.xy) / 1.2;
  float r = length(q);
  if (t < 0.0 || r > 26.0) return col;
  float aa = 0.6 / (uScale * 1.2), m;
  vec3 hat = PAL[int(fract(f.w * 13.7 + 0.3) * 9.0)], jac = PAL[int(fract(f.w * 7.13) * 9.0)], scf = PAL[int(fract(f.w * 29.3 + 0.7) * 9.0)];
  // the hole he made and ripple rings spreading from it (dark water, gentle: labels nearby stay readable)
  col = mix(col, vec3(0.05, 0.17, 0.23), ss(9.0, 5.5, r + 1.5 * sin(atan(q.y, q.x) * 5.0 + f.w * 9.0)) * ss(9.5, 7.0, t));
  float calm = ss(10.5, 4.0, t);
  for (int k = 0; k < 3; k++) {
    float tt = t - float(k) * (k < 1 ? 0.0 : 1.5) - (k == 2 ? 0.6 : 0.0);          // the splash, then one ring per bob
    if (tt <= 0.0) continue;
    float x = (r - 3.0 - 7.5 * tt) / 1.4;
    col *= 1.0 + 0.9 * x * exp(-x * x) * exp(-tt * 0.7) * calm * ss(24.0, 16.0, r);
  }
  // splash: a ring of drops thrown outwards
  if (t < 0.8) {
    float an = atan(q.y, q.x), c = floor(an * 11.0 / 6.2832), h = hash2(vec2(c, f.w * 50.0));
    float ac = (c + 0.5) * 6.2832 / 11.0;
    vec2 dp = vec2(cos(ac), sin(ac)) * (5.0 + (9.0 + 9.0 * h) * (1.0 - (1.0 - t / 0.8) * (1.0 - t / 0.8)));
    col = mix(col, vec3(0.90, 0.97, 1.0), ss(aa, -aa, length(q - dp) - (0.6 + 1.2 * h) * (1.0 - t / 0.8)) * 0.9);
    col = mix(col, vec3(0.85, 0.95, 0.99), (1.0 - ss(0.0, 1.6, abs(r - 4.0 - 10.0 * t))) * (1.0 - t / 0.8) * 0.6);
  }
  // in the water up to the shoulders, arms waving; bobs, then sinks
  float under = ss(3.5, 4.5, t);
  if (t > 0.12 && under < 1.0) {
    float bob = 1.0 - 0.16 * ss(0.6, 1.0, sin(t * 2.1 + 0.4)) - 0.55 * under;
    vec2 b = q / bob;
    float wv = sin(t * 11.0), al = (1.0 - under) * ss(0.12, 0.35, t);
    // arms up out of the water
    vec2 hl = vec2(1.0 + 4.0 * wv, 10.6 - 1.2 * wv), hr = vec2(1.0 - 4.0 * wv, -10.6 - 1.2 * wv);
    m = ss(aa, -aa, min(segD(b, vec2(0.0, 4.2), hl), segD(b, vec2(0.0, -4.2), hr)) - 1.6) * al;
    col = mix(col, jac * 0.75, m);
    m = ss(aa, -aa, min(length(b - hl), length(b - hr)) - 1.9) * al;
    col = mix(col, scf, m);
    // shoulders, half under: a ring of foam around them
    float dT = ellD(b, vec2(3.0, 5.2));
    col = mix(col, vec3(0.86, 0.95, 0.99), (1.0 - ss(0.0, 1.3, abs(dT - 1.4))) * al * 0.3);
    m = ss(aa, -aa, dT) * al; col = mix(col, jac * 0.62, m);
    float dH = length(b - vec2(1.2, 0.0)) - 3.2;
    vec3 hc = mix(hat * 0.95, hat * 0.6, ss(-1.1, -0.1, dH) * 0.6);
    hc = mix(hc, mix(hat, vec3(1.0), 0.75), ss(aa, -aa, length(b - vec2(0.7, 0.0)) - 1.25));
    m = ss(aa, -aa, dH) * al; col = mix(col, hc, m);
  }
  // bubbles where he went under
  if (t > 3.3 && t < 7.0) {
    for (int k = 0; k < 6; k++) {
      float fk = float(k), bt = fract((t - 3.3) * 0.75 + fk * 0.37);
      vec2 bp = vec2(hash2(vec2(fk, 1.0 + f.w)) - 0.5, hash2(vec2(fk, 7.0 + f.w)) - 0.5) * 9.0;
      col = mix(col, vec3(0.75, 0.92, 0.96), (1.0 - ss(0.0, 0.7, abs(length(q - bp) - (0.5 + 1.8 * bt)))) * (1.0 - bt) * ss(7.0, 5.0, t) * 0.75);
    }
  }
  // the hat stays afloat, drifting a little, until it too is gone
  if (t > 3.9 && t < 11.0) {
    vec2 hq = q - vec2(1.5 + 0.5 * (t - 3.9), 0.6 * sin(t * 0.8)) - 0.6 * vec2(sin(t * 1.7), cos(t * 1.3));
    float dH = length(hq) - 3.0;
    vec3 hc = mix(hat * 0.9, hat * 0.55, ss(-1.1, -0.1, dH) * 0.6);
    hc = mix(hc, mix(hat, vec3(1.0), 0.75), ss(aa, -aa, length(hq + vec2(0.4, 0.0)) - 1.2));
    col = mix(col, hc, ss(aa, -aa, dH) * ss(3.9, 4.4, t) * ss(11.0, 9.5, t));
  }
  return col;
}

// ---- snowfall: three layers of flakes carried by the wind; each casts a tiny soft shadow on the ice ----
vec3 snowfall(vec3 col, vec2 p, float calm) {
  float shadow = 0.0, flake = 0.0;
  for (int l = 0; l < 3; l++) {
    float fl = float(l);
    float G = l == 0 ? 34.0 : l == 1 ? 58.0 : 104.0;
    float sp = l == 0 ? 15.0 : l == 1 ? 25.0 : 42.0;          // nearer flakes cross the view faster
    float R = l == 0 ? 0.85 : l == 1 ? 1.3 : 2.2;
    float hg = l == 0 ? 5.0 : l == 1 ? 12.0 : 26.0;           // how far the shadow falls: height above the ice
    vec2 pp = p - (WIND + vec2(0.0, 0.35)) * uTime * sp + fl * 37.0;
    for (int k = 0; k < 2; k++) {
      vec2 ps = k == 0 ? pp : pp - SHDIR * hg;
      vec2 c = floor(ps / G);
      float h = hash2(c + fl * 17.3);
      if (h > uSnow * 0.9) continue;
      vec2 ctr = (c + 0.25 + 0.5 * vec2(hash2(c + 1.3), hash2(c + 7.9))) * G;
      ctr += vec2(sin(uTime * (0.7 + h) + h * 50.0), cos(uTime * (0.6 + h * 0.7) + h * 31.0)) * G * 0.07;
      float d = length(ps - ctr);
      if (k == 0) flake = max(flake, ss(R + 0.8, R - 0.7, d) * (l == 2 ? 0.62 : 0.9));
      else shadow = max(shadow, ss(R + 1.6 + fl, R - 1.0, d) * (0.34 - 0.07 * fl));
    }
  }
  col = mix(col, col * SHADE, shadow * calm);
  return mix(col, vec3(1.0), flake * calm);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  vec2 uv = p / uRes;
  float t = uTime;
  float sd = sdist(field(p));
  vec4 n1 = N(p, 1500.0), n2 = N(p + 311.0, 420.0), n3 = N(p + 71.0, 110.0);
  float jag = (n3.b - 0.5) * 8.0 + (n3.a - 0.5) * 3.0;
  float e = sd + jag;                                          // ragged ice edge (<0: open water)
  vec3 col = vec3(0.0);

  if (e > -3.0) {
    // ---------- ice: washes of frosted ice with windows of clear dark ice ----------
    float wash = n1.b * 0.6 + n2.r * 0.4;                                              // soft washes inside a sheet
    float frost = clamp(0.57 + (wash - 0.5) * 1.5 + (n1.r - 0.5) * 0.5, 0.0, 1.0);
    float clearI = ss(0.36, 0.25, frost);
    vec3 cClear = mix(vec3(0.16, 0.38, 0.53), vec3(0.25, 0.49, 0.63), n2.b);
    vec3 ice = mix(mix(vec3(0.47, 0.69, 0.83), vec3(0.74, 0.87, 0.945), ss(0.25, 0.9, frost)), cClear, clearI);
    ice *= 1.0 - 0.05 * (1.0 - ss(0.0, 0.02, abs(frost - 0.32)));                      // pooled pigment where the washes meet
    ice *= 0.975 + 0.05 * n3.r;
    // inside the ice: cracks seen as white sheets with depth, feathered planes, trapped bubbles; old scratches on top
    vec4 det = texture(uDet, uv), det2 = texture(uDet, uv - vec2(1.6, 2.4) / uRes);
    ice = mix(ice, vec3(0.74, 0.90, 0.96), det2.r * 0.34 * (0.25 + 0.75 * clearI));
    ice = mix(ice, vec3(0.80, 0.93, 0.97), det.g * (0.12 + 0.68 * clearI));
    ice = mix(ice, vec3(0.95, 0.99, 1.00), det.r * (0.42 + 0.5 * clearI));
    ice = mix(ice, mix(vec3(0.80, 0.91, 0.97), vec3(0.86, 0.95, 0.99), clearI), det.b * 0.5);
    // new ice where a pool froze over a moment ago: dark and glassy, frosting over in patches as it ages
    float sc = texture(uScar, (p / uStep + 0.5) / uGrid).r;
    float newIce = ss(0.10, 0.50, sc - 0.18 * n3.r * (1.0 - sc) + (n3.a - 0.5) * 0.08);
    if (newIce > 0.0) {
      vec3 cNew = mix(vec3(0.13, 0.34, 0.45), vec3(0.20, 0.44, 0.54), n2.b);
      cNew += 0.05 * ss(0.5, 0.8, N(p * vec2(0.5, 1.2) + 13.0, 300.0).g);                    // a soft sheen
      ice = mix(ice, cNew, newIce * 0.92);
      // hoarfrost creeping in from the older ice around it
      float front = 1.0 - ss(0.0, 0.5, abs(newIce - 0.42));
      ice = mix(ice, vec3(0.86, 0.95, 0.99), front * (0.18 + 0.55 * ss(0.35, 0.8, n3.a * 0.6 + N(p + 7.0, 34.0).a * 0.4)));
    }
    // meltwater on the ice around a pool, glossy streaks, fracture rings
    float wet = ss(50.0, 6.0, sd + (n3.g - 0.5) * 18.0);
    ice = mix(ice, ice * vec3(0.66, 0.80, 0.88), wet * 0.6);

      if (!o || o === s || o.wait > 0) continue;
      const dx = o.x - s.x, dy = o.y - s.y, d = Math.hypot(dx, dy);
      if (d > 72 || d < 1e-3 || (c * dx + sn * dy) / d < -0.3) continue;
      steer += (c * dy - sn * dx > 0 ? -1 : 1) * 1.6 * (1 - d / 72);
    }
    // now and then head for another part of the lake, so nobody scribbles in one corner
    s.destT = (s.destT || 0) - dt;
    if (s.exiting) { /* heading off the lake */ }
    else if (!s.dest || s.destT <= 0 || Math.hypot(s.dest[0] - s.x, s.dest[1] - s.y) < 90) {
      s.destT = 14 + Math.random() * 16; s.dest = null;
      for (let k = 0; k < 12 && !s.dest; k++) {
        const x = 60 + Math.random() * (W - 120), y = 60 + Math.random() * (H - 120);
        if (clearance(x, y, s) > 40 && Math.hypot(x - s.x, y - s.y) > 280) s.dest = [x, y];
      }
    }
    if (s.dest && !s.turnDir) {
      const da = Math.atan2(s.dest[1] - s.y, s.dest[0] - s.x) - s.a;
      steer += Math.max(-0.45, Math.min(0.45, Math.atan2(Math.sin(da), Math.cos(da)) * 0.5));
    }
    s.a += (s.k * s.v + steer) * dt;
    if (s.kind === 1) s.a += Math.sin(simT * 4.3 + s.hue * 40) * 0.9 * dt;   // the kid wobbles
    const vt = s.vT * (1 - 0.35 * Math.min(1, Math.abs(s.k) * 45)) * (tight < 0 ? 0.75 : 1);
    if (s.glide > 0) {                                                       // coasting: feet together
      s.glide -= dt;
      s.ph += (Math.round(s.ph / Math.PI) * Math.PI - s.ph) * Math.min(1, dt * 4);
      s.v *= Math.exp(-0.10 * dt);
    } else {
      s.v += (vt - s.v) * Math.min(1, dt * 1.2);
      s.ph += dt * 6.283 * (0.5 + s.v / 150) * (s.kind === 1 ? 1.6 : 1);
    }
    c = Math.cos(s.a); sn = Math.sin(s.a);
    s.x += c * s.v * dt; s.y += sn * s.v * dt;
    if (s.entering) {
      if (s.x > 44 && s.y > 44 && s.x < W - 44 && s.y < H - 44) s.entering = false;
      else if (s.age > 14) { s.wait = 1; continue; }
    } else if (s.x < -50 || s.y < -50 || s.x > W + 50 || s.y > H + 50) { s.wait = 1; continue; }
    // traces
    const f = feet(s.x, s.y, s.a, s.ph, s.size, s.kind === 1);
    if (s.alpha > 0.6) trace(s.pf, f);
    s.pf = f;
    if (s.pair) {
      const f2 = feet(s.x - sn * off, s.y + c * off, s.a, s.ph + Math.PI, s.size, false);
      if (s.alpha > 0.6) trace(s.pf2, f2);
      s.pf2 = f2;
    } else s.pf2 = null;
  }
  // pack for the shader (the partner of a pair takes the next slot)
  skU.fill(0); skB.fill(0);
  for (let i = 0; i < SK_MAX; i++) {
    const s = skaters[i];
    if (!s || s.wait > 0 || s.alpha <= 0) continue;
    const al = sstep(0, 1, s.alpha);
    skU.set([s.x, s.y, s.a, s.ph], i * 4);
    skB.set([s.size, (s.doomed ? 4 : s.pair ? 2 : s.kind === 1 ? 1 : 0) + s.hue * 0.999, 0, al], i * 4);
    if (s.pair) {
      const off = 16.5 * s.size;
      skU.set([s.x - Math.sin(s.a) * off, s.y + Math.cos(s.a) * off, s.a, s.ph + Math.PI], (i + 1) * 4);
      skB.set([s.size * 0.95, (s.doomed ? 4 : 3) + ((s.hue * 7.77) % 1) * 0.999, 0, al], (i + 1) * 4);
    }
  }
}
// let the lake live for a while before the first frame, so the ice already carries traces
function presim(sec) {
  if (!mk || !FB) return;
  const m = curMix;
  curMix = 1; bulk = true; skInside = true;
  stepProps(1, true);
  for (let t = 0, k = 0; t < sec; t += 1 / 30, k++) {
    stepSkaters(1 / 30);
    if (k % 60 === 59) fadeRows(0, MH);
  }
  curMix = m; bulk = false; skInside = false;
  uploadAllMarks();
}
function stepLife(sdt, dt) {
  stepProps(dt, false);
  if (iconsSeen) stepSkaters(sdt);
  stepFalls(sdt);
  stepCracks(dt);
  scarAcc += dt;
  if (scarAcc >= 0.4) { scarAcc = 0; scarTick(); }
  sweepMarks(sdt);
}

/* ======================================================================
   Frame loop
   ====================================================================== */
function resize() {
  W = innerWidth; H = innerHeight;
  const scale = PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, P.quality);
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
  allocMarks();
  allocScar();
  buildDetail();
  tips = []; skaters.fill(null); skInside = true;
  props.forEach(pr => { pr.on = false; pr.alpha = 0; pr.retry = 0; });
}

const T0 = performance.now();
let lastT = 0, fpsEMA = 0, frameN = 0, frameMs = 0, lifeT = 0;
let paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 31) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  if (lastT) fpsEMA = fpsEMA ? fpsEMA * 0.9 + (1 / dt) * 0.1 : 1 / dt;
  lastT = now;
  lifeT += dt * P.speed;
  stepLife(dt * P.speed, dt);
  draw(now);
  frameN++;
}
function draw(now) {
  const t0 = performance.now();
  const e = Math.min(Math.max((now - morphT0) / morphDur, 0), 1);
  curMix = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  flushMarks();
  const { p, U } = PR;
  gl.useProgram(p);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ftex[fromI]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ftex[toI]);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, detTex);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, markTex);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, scarTex);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(U.uNoise, 0); gl.uniform1i(U.uFA, 1); gl.uniform1i(U.uFB, 2); gl.uniform1i(U.uDet, 3); gl.uniform1i(U.uMark, 4); gl.uniform1i(U.uScar, 5);
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (seed % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uTime, lifeT % 3600);
  gl.uniform1f(U.uCover, P.cover);
  gl.uniform1f(U.uSnow, P.snowfall);
  gl.uniform1f(U.uRim, Math.min(Math.max(1.02 * P.sigma - 28, 12), 40));      // the lively band of a pool stops short of the icons
  gl.uniform4fv(U.uSk, skU); gl.uniform4fv(U.uSkB, skB);
  gl.uniform4fv(U.uProp, propU);
  gl.uniform4fv(U.uFall, fallU);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frameMs = performance.now() - t0;
}

/* ======================================================================
   Settings / hosted mode
   ====================================================================== */
let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise(); buildDetail();
  props.forEach(pr => { pr.on = false; pr.retry = 0; });
  if (!iconsSeen) { refresh(); return; }
  commit(true);
}
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false;
  for (const k in v) {
    if (!KEYS[k] || typeof v[k] !== 'number' || !isFinite(v[k]) || P[k] === v[k]) continue;
    const [lo, hi] = KEYS[k];
    let x = Math.min(Math.max(v[k], lo), hi);
    if (k === 'skaters' || k === 'extras') x = Math.round(x);
    P[k] = x;
    if (k === 'sigma') field = true;
    if (k === 'cracks') buildDetail();
  }
  if (field && FB) commit();                      // pool size: smooth transition too
}
function drawGhosts() {
  const box = document.getElementById('ghosts');
  if (box) box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  refresh();                                     // a solid sheet of ice until we know where the icons are
  let first = true;
  const handle = m => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical -> CSS pixels
    icons = m.vis && Array.isArray(m.r) ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: the pools thaw; later: smooth transition
    if (first) presim(LIFETEST ? 70 : 25);
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) { try { handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); } catch (e) {} } });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => { try { handle(JSON.parse(ev.data)); } catch (e) { console.error(e); } });
  host.postMessage('ready');
}
function startDemo() {
  // plain browser: a column of icons on the right and a few scattered ones
  const list = [];
  for (let r = 0; r < 6; r++) list.push({ x: W - 90, y: 10 + r * 100, w: 76, h: 92 });
  list.push({ x: W * 0.22, y: H * 0.3, w: 76, h: 92 }, { x: W * 0.45, y: H * 0.62, w: 76, h: 92 }, { x: W * 0.52, y: H * 0.18, w: 76, h: 92 });
  icons = list;
  commit(true);
  presim(LIFETEST ? 70 : 25);
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); refresh(); if (iconsSeen) presim(25); }, 100);
});

window.__dbg = { P, stats: () => ({ fieldMs, frameMs, fps: fpsEMA, skaters: skaters.filter(Boolean).length, tips: tips.length }) };
resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else startDemo();
requestAnimationFrame(frame);
</script>
<script src="share.js"></script>
<script src="sound.js"></script>
