<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconland · Ant Colony</title>
<!--
  Iconland · Ant Colony (a sunny patch of forest floor seen from above; WebGL2)
  - Ground is STATIC (seed + screen size + details): soil with fine crumbs, pebbles, fallen leaves, pine needles,
    twigs, grass tufts and clover along the screen edges. It is baked once into a texture (Canvas2D debris over a
    procedural soil shader) and only cross-faded when the seed or the details setting change.
  - Every cluster of desktop icons sits on an anthill. Mound field (CPU, only when icons change): gaussian metaballs
    around the icon rects -> signed distance (<0 on the mound), morphed on the GPU exactly like the other themes
    (A/B textures, blendFields on a commit mid-transition). The mound is shaded per pixel: dome profile from the
    distance, a fixed screen-space lattice of soil crumbs and pine needles revealed by the field (they never crawl).
  - Life (JS): nests = connected mounds, entrance holes on their rim. Ants leave the holes, walk shared routes to
    food (crumbs, sugar cube, raspberry, leaf), nibble, carry a bit home; others travel between nests or explore.
    Foods appear now and then and shrink away. Where ants walk, a worn trail builds up (CPU accumulation grid,
    uploaded every 1.5 s and cross-faded, so it never pops). A ladybug or a ground beetle wanders by now and then.
  - Rendering: one full-screen pass (ground texture + trails + mounds), then instanced sprites (holes, food, beetle,
    ants) drawn procedurally in their own local coordinates.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6e5640; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.55); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="nogl">WebGL2 is not available.</div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const STEP = 5, TS = 4, TASKBAR = 0;
const MORPH_MS = 1800, GROW_MS = 2600, GFADE_MS = 1200;
const S_CLAMP = 120, D_CLAMP = 600;
const WARP = 24;
const TR_PERIOD = 1.5, TR_TAU = 300, TR_K = 2.5;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');
const PREVIEW = QS.has('preview');
// Defaults must match themes.json
const P = {
  sigma: 55, ants: 0.5, food: 0.5, details: 0.6, trails: 1, speed: 1,
  quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const KEYS = { sigma: [30, 120], ants: [0, 1], food: [0, 1], details: [0, 1], trails: [0, 1], speed: [0, 3] };

/* ======================================================================
   Random / noise helpers (CPU)
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const h = (a, b) => { let v = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(k, 2246822519); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  const a = h(x0, y0), b = h(x1, y0), c = h(x0, y1), d = h(x1, y1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [4, 8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let s = 0, w = 0.5, tw = 0;
      for (let j = 0; j < chans[c].length; j++) { const p = chans[c][j]; s += w * tileNoise(u * p, v * p, p, p, 100 + c * 50 + j * 13); tw += w; w *= 0.5; }
      d[i + c] = Math.min(Math.max((s / tw - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const rnd = () => Math.random();

/* ======================================================================
   Field grid noise (seed only)
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N), fn: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.006, y * 0.006, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.006, y * 0.006, 2) - 0.47;
    NZ.fn[i] = fbm(x * 0.02, y * 0.02, 3) - 0.47;
  }
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ======================================================================
   Mound field (CPU, on icon change): s = signed distance to the mound edge (<0 on the mound)
   ====================================================================== */
let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = WARP * 2.4, wmax = wa * 0.5;
  for (const r of rects) {
    const Rf = sig * 1.1 + 150, Rf2 = Rf * Rf;
    const R = Rf + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.3, chh = r.hh * 0.3;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
      const qx = x + NZ.wx[i] * wa, qy = y + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      const d2 = dx * dx + dy * dy;
      if (d2 < Rf2) f1[i] += Math.exp(-d2 * is1);
    }
  }
  // smooth (C1) version of sqrt(max(-g, 0)) - k*max(g, 0): a hard max leaves a visible crease on the shaded dome
  const sp = x => x > 20 ? x : Math.log1p(Math.exp(3 * x)) / 3;
  const prof = g => Math.sqrt(sp(-g) + 0.05) - 0.6 * sp(g);
  const c0 = prof(Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-60);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = Math.min(D_CLAMP, sig * (prof(g) - c0) + NZ.fn[i] * WARP * 0.8);
  }
  // a mound near the screen edge runs on off-screen (no rim along the frame)
  const M = 40, mx0 = Math.round(M / STEP), my0 = mx0, mx1 = Math.floor((W - M) / STEP), my1 = Math.floor((H - M) / STEP);
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const cx = Math.min(Math.max(gx, mx0), mx1), cy = Math.min(Math.max(gy, my0), my1);
    if (cx !== gx || cy !== gy) { const i = gy * Gw + gx, v = s[cy * Gw + cx]; if (v < s[i]) s[i] = v; }
  }
  // a true distance near the edge (divide by the gradient), so the slope is even all round
  const out = new Float32Array(N);
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, v = s[i];
    if (v > 400) { out[i] = v; continue; }
    const ax = gx > 0 ? s[i - 1] : v, bx = gx < Gw - 1 ? s[i + 1] : v, ay = gy > 0 ? s[i - Gw] : v, by = gy < Gh - 1 ? s[i + Gw] : v;
    const gm = Math.hypot(bx - ax, by - ay) / (2 * STEP);
    out[i] = v / (1 + (Math.min(Math.max(gm, 0.5), 2.5) - 1) * sstep(70, 25, Math.abs(v)));
  }
  for (let i = 0; i < N; i++) s[i] = out[i] < -S_CLAMP ? -S_CLAMP : out[i];
  fieldMs = performance.now() - t0;
  return { s };
}
const emptyField = () => ({ s: new Float32Array(Gw * Gh).fill(D_CLAMP) });

/* ======================================================================
   Shaders
   ====================================================================== */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const COMMON = `
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }
`;

// ---- ground bake: soil + debris overlay (static, rendered into a texture) ----
const FS_BAKE = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uOv;
uniform vec2 uCv;
uniform float uScale, uSeed;
out vec4 o;
${COMMON}
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
void main() {
  vec2 p = vec2(gl_FragCoord.x, uCv.y - gl_FragCoord.y) / uScale;
  vec4 n1 = N(p, 1300.0), n2 = N(p, 300.0), n3 = N(p, 70.0), n4 = N(p + 91.0, 760.0);
  vec3 col = mix(vec3(0.46, 0.345, 0.235), vec3(0.575, 0.44, 0.305), n1.r);
  col = mix(col, vec3(0.38, 0.28, 0.19), ss(0.55, 0.85, n2.g) * 0.3);       // damp patches
  col = mix(col, vec3(0.62, 0.50, 0.36), ss(0.6, 0.9, n2.b) * 0.15);        // dry, sandy patches
  col *= 0.94 + 0.12 * n3.b;
  // fine soil crumbs
  const vec2 LD = vec2(-0.5914, -0.8064);
  float cs = 2.3;
  vec2 gp = p / cs, ib = floor(gp);
  float bd = 1e9; vec2 bc = vec2(0.0); float br = 1.0; vec3 bh = vec3(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = ib + vec2(float(i), float(j));
    vec2 hh = hash22(c + 3.7);
    vec2 cc = c + 0.2 + 0.6 * hh;
    float r = 0.22 + 0.3 * hash2(c + 9.1);
    float d = length(gp - cc) - r;
    if (d < bd) { bd = d; bc = cc; br = r; bh = vec3(hh, hash2(c + 21.7)); }
  }
  float aa = 0.8 / uScale;
  float inG = 1.0 - ss(-aa, aa, bd * cs);
  vec2 nq = (gp - bc) / br;
  vec3 gcol = col * (0.9 + 0.2 * bh.x) * (1.0 + 0.14 * dot(nq, LD) - 0.06 * dot(nq, nq));
  gcol = mix(gcol, vec3(0.70, 0.65, 0.57) * (0.9 + 0.2 * bh.y), step(0.994, bh.z));   // quartz grains
  col = mix(col * 0.95, gcol, inG);
  col *= 0.97 + 0.06 * hash2(floor(gl_FragCoord.xy) + 0.5);
  // dappled sunlight
  float sun = ss(0.48, 0.74, n4.a);
  col = mix(col, col * vec3(1.08, 1.05, 0.97), sun);
  col *= 1.0 - 0.04 * ss(0.62, 0.32, n4.a);
  vec4 ov = texelFetch(uOv, ivec2(int(gl_FragCoord.x), int(uCv.y - 1.0 - gl_FragCoord.y)), 0);
  col = ov.rgb + col * (1.0 - ov.a);
  o = vec4(col, 1.0);
}`;

// ---- per frame: ground + worn trails + mounds ----
const FS = `#version 300 es
precision highp float;
uniform sampler2D uG0, uG1, uCA, uCB, uTA, uTB;
uniform vec2 uCv, uGrid, uTGrid;
uniform float uScale, uStep, uTS, uMix, uBump, uGMix, uTMix, uTOn, uRH;
out vec4 o;
${COMMON}
float field(vec2 p) { vec2 uv = (p / uStep + 0.5) / uGrid; float a = texture(uCA, uv).r, b = texture(uCB, uv).r; return mix(a, b, uMix) + uBump * abs(a - b); }
void main() {
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec2 p = vec2(gl_FragCoord.x, uCv.y - gl_FragCoord.y) / uScale;
  vec3 col = mix(texelFetch(uG0, ip, 0).rgb, texelFetch(uG1, ip, 0).rgb, uGMix);
  float AA = 0.75 / uScale;
  if (uTOn > 0.0) {
    vec2 tuv = (p / uTS + 0.5) / uTGrid;
    float tr = mix(texture(uTA, tuv).r, texture(uTB, tuv).r, uTMix);
    float w = ss(0.03, 0.8, tr) * uTOn;
    col = mix(col, mix(col, vec3(0.64, 0.52, 0.38), 0.5) * 1.06, w * 0.6);   // worn: lighter, smoother soil
  }
  float s = field(p);
  if (s < 70.0) {
    float sh = field(p - vec2(7.0, 9.0));
    col *= 1.0 - 0.34 * (1.0 - ss(-16.0, 14.0, sh)) * ss(-8.0, 4.0, s);   // drop shadow, lower right
    col *= 1.0 - 0.09 * ss(45.0, 4.0, s);                               // freshly dug soil around the hill
    if (s < 30.0) {
      float e = 3.0;
      vec2 g = vec2(field(p + vec2(e, 0.0)) - field(p - vec2(e, 0.0)), field(p + vec2(0.0, e)) - field(p - vec2(0.0, e))) / (2.0 * e);
      float x = clamp(-s / uRH, 0.0, 1.0);
      float h = sqrt(x * (2.0 - x));
      vec2 sl = -g * (1.0 - x) / max(h, 0.2) * 0.9 * (1.0 - ss(-3.0, 4.0, s));
      sl *= ss(25.0, 70.0, min(min(p.x, p.y), min(uCv.x / uScale - p.x, uCv.y / uScale - p.y)));   // mounds run off-screen flat
      float sm = length(sl); if (sm > 1.5) sl *= 1.5 / sm;
      vec3 n = normalize(vec3(-sl, 1.0));
      const vec3 L = vec3(-0.3819, -0.5208, 0.7638);
      float lit = clamp(dot(n, L) / 0.7638, 0.55, 1.5) * (0.86 + 0.2 * h);
      float deep = ss(-30.0, -90.0, s);                    // under the icons: calmer texture
      lit = mix(lit, 1.0, deep * 0.3);
      const vec2 LD = vec2(-0.5914, -0.8064);
      // soil crumbs piled up (fixed lattice, revealed by the field)
      float cs = 2.6;
      vec2 gp = p / cs, ib = floor(gp);
      float bd = 1e9; vec2 bc = vec2(0.0); float br = 1.0; vec4 bh = vec4(0.0);
      for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
        vec2 c = ib + vec2(float(i), float(j));
        vec2 hh = hash22(c + 17.0);
        vec2 cc = c + 0.18 + 0.64 * hh;
        float r = 0.36 + 0.26 * hash2(c + 3.1);
        float d = length(gp - cc) - r;
        if (d < bd) { bd = d; bc = cc; br = r; bh = vec4(hh, hash2(c + 7.7), hash2(c + 11.3)); }
      }
      float inG = 1.0 - ss(-AA, AA, bd * cs);
      vec2 nq = (gp - bc) / br;
      float thr = (bh.z - 0.5) * 12.0 - 1.0;
      float vis = 1.0 - ss(thr - 8.0, thr + 8.0, s);
      float spill = ss(0.0, 0.25, 0.5 * exp(-max(s, 0.0) / 9.0) - bh.w) * ss(34.0, 6.0, s);   // soft: crumbs fade, never pop
      vis = max(vis, spill);
      float body = 1.0 - ss(-12.0, 2.0, s);
      vec3 base = mix(vec3(0.35, 0.245, 0.16), vec3(0.235, 0.16, 0.105), bh.x);
      base = mix(base, vec3(0.52, 0.36, 0.2), step(0.8, bh.y));      // bits of needles and bark
      base = mix(base, vec3(0.40, 0.355, 0.30), step(0.97, bh.w) * (1.0 - step(0.8, bh.y)));
      base = mix(base, vec3(0.30, 0.215, 0.145), deep * 0.45);
      float gsh = 1.0 + (0.24 * dot(nq, LD) - 0.14 * dot(nq, nq)) * (1.0 - 0.45 * deep);
      vec3 crev = mix(vec3(0.115, 0.08, 0.05), vec3(0.2, 0.14, 0.09), deep * 0.6);
      vec3 mc = mix(col, crev * lit, body);
      mc = mix(mc, base * gsh * lit, inG * vis);
      // pine needles on the hill
      float cn = 7.0;
      vec2 nb = floor(p / cn);
      float nd = 1e9, nt = 0.0, nl = 0.0;
      for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
        vec2 c = nb + vec2(float(i), float(j));
        vec2 h1 = hash22(c + 41.0), h2 = hash22(c + 59.0);
        if (h1.x < 0.85) {
          vec2 cc = (c + 0.5 + (h2 - 0.5) * 0.9) * cn;
          float a = h1.y * 6.2832;
          vec2 dv = vec2(cos(a), sin(a)) * (3.5 + 4.0 * h2.x);
          float d = segD(p, cc - dv, cc + dv);
          if (d < nd) { nd = d; nt = h2.y; nl = h1.x; }
        }
      }
      float ncov = 1.0 - ss(-18.0, -4.0, s + (nt - 0.5) * 10.0);
      ncov *= 1.0 - 0.55 * deep;
      float nv = (1.0 - ss(0.5 - AA, 0.5 + AA, nd)) * ncov;
      float nh = (1.0 - ss(0.5, 1.6, nd)) * ncov;
      vec3 ncol = mix(vec3(0.64, 0.44, 0.21), vec3(0.45, 0.29, 0.14), nt) * lit;
      mc *= 1.0 - 0.3 * nh;
      mc = mix(mc, ncol, nv);
      col = mc;
    }
  }
  o = vec4(col, 1.0);
}`;

// ---- instanced sprites: holes, food, beetle, ants (each drawn in its own local coordinates) ----
const VS_SPR = `#version 300 es
layout(location = 0) in vec4 iA;   // x, y, angle, size
layout(location = 1) in vec4 iB;   // kind, phase, alpha, aux
layout(location = 2) in vec4 iC;   // aux2, aux3, extent (px), aux4
uniform vec2 uRes;
uniform float uScale;
out vec2 vL;
flat out vec4 vB;
flat out vec4 vC;
flat out vec2 vLt;
flat out vec2 vSh;
flat out float vAA;
void main() {
  vec2 c = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1)) * 2.0 - 1.0;
  float ca = cos(iA.z), sa = sin(iA.z);
  vec2 off = c * iC.z;
  vec2 pos = iA.xy + vec2(ca * off.x - sa * off.y, sa * off.x + ca * off.y);
  vL = off / iA.w;
  gl_Position = vec4(pos.x / uRes.x * 2.0 - 1.0, 1.0 - pos.y / uRes.y * 2.0, 0.0, 1.0);
  vAA = 0.7 / (iA.w * uScale);

  // trails
  trClock += dt;
  if (trClock - trT0 >= TR_PERIOD) uploadTrails();
  trOn += Math.max(-rdt, Math.min(rdt, (P.trails ? 1 : 0) - trOn));
}

/* ---------- sprite instances ---------- */
let nInst = 0;
function put(x, y, ang, size, kind, ph, alpha, aux, a2, a3, ext, a4) {
  if (nInst >= MAXI || alpha <= 0.003) return;
  const o = nInst++ * IST;
  inst[o] = x; inst[o + 1] = y; inst[o + 2] = ang; inst[o + 3] = size;
  inst[o + 4] = kind; inst[o + 5] = ph; inst[o + 6] = alpha; inst[o + 7] = aux;
  inst[o + 8] = a2; inst[o + 9] = a3; inst[o + 10] = ext; inst[o + 11] = a4;
}
function buildInstances() {
  nInst = 0;
  for (const h of holes) put(h.x, h.y, h.rot, 1, 1, 0, h.alpha, h.seed, 0, 0, 12, 0);
  for (const f of foods) {
    const sc = foodScale(f);
    put(f.x, f.y, f.rot, sc, f.kind, 0, clamp01(f.alpha), 0, 0, f.seed, FOOD_EXT[f.kind] * sc + 2, f.kind === 5 ? 1 - f.amount : 0);
  }
  if (bug.on) put(bug.x, bug.y, bug.hd, 1.05, 6, bug.ph, 1, 0, 0, bug.lady ? 0 : 1, 9, 0);
  for (const a of ants) put(a.rx, a.ry, a.hd, a.size, 0, a.ph, a.alpha, a.aph, a.carry, a.tint, (a.carry === 4 ? 9.5 : 8.6) * a.size, 0);
}

/* ======================================================================
   Frame loop
   ====================================================================== */
function resize() {
  W = innerWidth; H = innerHeight;
  const scale = PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, P.quality);
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
  allocTrails();
  bakeAll();
}

const T0 = performance.now();
let lastT = 0, fpsEMA = 0, frameN = 0, frameMs = 0, lifeT = 0;
let paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 31) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  if (lastT) fpsEMA = fpsEMA ? fpsEMA * 0.9 + (1 / dt) * 0.1 : 1 / dt;
  lastT = now;
  const sdt = dt * P.speed;
  rawDt = dt;
  lifeT += sdt;
  stepLife(lifeT, sdt);
  draw(now);
  frameN++;
}
const ease = e => e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
function draw(now) {
  const t0 = performance.now();
  curMix = ease(Math.min(Math.max((now - morphT0) / morphDur, 0), 1));
  if (!gtex[0] || gW !== cv.width || gH !== cv.height) bakeAll();
  const gm = ease(Math.min(Math.max((now - gT0) / GFADE_MS, 0), 1));
  // 1) ground + trails + mounds
  const { p, U } = PR;
  gl.useProgram(p);
  gl.bindVertexArray(vaoFull);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.disable(gl.BLEND);
  const tex = [gtex[1 - gCur], gtex[gCur], ftex[fromI], ftex[toI], trTex[0], trTex[1]];
  ['uG0', 'uG1', 'uCA', 'uCB', 'uTA', 'uTB'].forEach((nm, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex[i]); gl.uniform1i(U[nm], i);
  });
  gl.uniform2f(U.uCv, cv.width, cv.height);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform2f(U.uTGrid, Tw, Th);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uTS, TS);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uBump, bumpAt(curMix));
  gl.uniform1f(U.uGMix, gm);
  gl.uniform1f(U.uTMix, Math.min(1, (trClock - trT0) / TR_PERIOD));
  gl.uniform1f(U.uTOn, trOn);
  gl.uniform1f(U.uRH, Math.min(Math.max(P.sigma * 1.3, 40), 110));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 2) sprites
  buildInstances();
  if (nInst) {
    gl.useProgram(PS.p);
    gl.bindVertexArray(vaoSpr);
    gl.bindBuffer(gl.ARRAY_BUFFER, ibuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, nInst * IST);
    gl.uniform2f(PS.U.uRes, cv.width / cv._scale, cv.height / cv._scale);
    gl.uniform1f(PS.U.uScale, cv._scale);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nInst);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(vaoFull);
  }
  frameMs = performance.now() - t0;
}

/* ======================================================================
   Settings / hosted mode
   ====================================================================== */
let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise();
  bakeFade();
  if (iconsSeen && FB) commit(); else refresh();
}
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, ground = false, pop = false;
  for (const k in v) {
    if (!KEYS[k] || typeof v[k] !== 'number' || !isFinite(v[k]) || P[k] === v[k]) continue;
    const [lo, hi] = KEYS[k];
    P[k] = Math.min(Math.max(v[k], lo), hi);
    if (k === 'trails') P[k] = P[k] >= 0.5 ? 1 : 0;
    if (k === 'sigma') field = true;
    if (k === 'details') ground = true;
    if (k === 'ants') pop = true;
  }
  if (ground) bakeFade();
  if (field && FB) commit();
  if (pop) balance();
}
function drawGhosts() {
  const box = document.getElementById('ghosts');
  if (box) box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  refresh();
  let first = true;
  const handle = m => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical -> CSS pixels
    icons = m.vis && Array.isArray(m.r) ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: mounds grow in; later: smooth transition
    if (first) { foodT = 4; for (let i = Math.round(1 + 2 * P.food); i > 0; i--) spawnFood(true); }
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) { try { handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); } catch (e) {} } });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => { try { handle(JSON.parse(ev.data)); } catch (e) { console.error(e); } });
  host.postMessage('ready');
}
function startDemo() {
  const list = [];
  for (let r = 0; r < 6; r++) list.push({ x: W - 90, y: 10 + r * 100, w: 76, h: 92 });
  list.push({ x: W * 0.22, y: H * 0.3, w: 76, h: 92 }, { x: W * 0.45, y: H * 0.62, w: 76, h: 92 }, { x: W * 0.52, y: H * 0.18, w: 76, h: 92 });
  icons = list;
  commit(true);
  for (let i = Math.round(1 + 2 * P.food); i > 0; i--) spawnFood(true);
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); refresh(); }, 100);
});

window.__dbg = {
  P,
  stats: () => ({ fieldMs, ovMs, frameMs, fps: fpsEMA, nests: nests.length, holes: holes.length, ants: ants.length, foods: foods.length, inst: nInst,
    pool: nests.reduce((s, n) => s + n.pool, 0) }),
  // dev: run the colony forward (trails build up), then draw
  warm(sec) {
    for (let i = 0; i < sec * 30; i++) { rawDt = 1 / 30; lifeT += 1 / 30; stepLife(lifeT, 1 / 30); }
    uploadTrails(); trT0 = trClock - TR_PERIOD;
    draw(performance.now());
  },
  sprites: () => { const r = []; for (let i = 0; i < nInst; i++) r.push([inst[i * IST], inst[i * IST + 1], inst[i * IST + 10]]); return r; },
  bug,
};
buildNoiseTex();
resize();
if (WALL || PREVIEW) startHostedMode();
else startDemo();
requestAnimationFrame(frame);
</script>
<script src="share.js"></script>
</body>
