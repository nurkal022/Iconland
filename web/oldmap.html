<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconland · Old Sea Chart</title>
<!--
  Iconland · Old Sea Chart (an antique hand-inked sea chart on aged parchment; WebGL2, one full-screen pass)
  - Islands are FIXED: placed from the seed and the screen size (4-8 islands of mixed sizes, metaball shapes
    with a noise-warped coast). Their signed distance field is computed once on the CPU (seed / size / settings
    change only) and drawn in sepia ink: firm coastline, engraved waterlines, stippled shore, a hand-coloured band.
  - Static ink overlay (Canvas2D, redrawn with the islands): map symbols (mountains, hills, groves, a port town,
    a lighthouse), the dotted sea routes (minimum spanning tree between islands + one extra link) and faint rhumb
    lines from the compass rose. Channels: R = land-only ink, G = sea-only ink, B = ink anywhere.
  - The desktop icons do NOT make land: each cluster of icons is hidden under an antique cartographic cloud.
    Cloud field (CPU, only when icons change): gaussian metaballs -> signed distance (<0 under the cloud).
    In the shader the cloud edge is billowed by a fixed lattice of circles whose radii follow the field at
    their (fixed) centres, so the scallops grow and shrink smoothly with the field and never crawl.
    Ink outline, billow arcs, engraved hatching on the shadow side, a soft drop shadow below-right.
  - Life: 2-3 little ships ply the routes (pausing in port), now and then a sea monster shows up in open water:
    a sea serpent, the kraken, or a ghost ship drifting out of the mist (one at a time, at random).
    Both are drawn in their own local coordinates (no screen-space sampling inside moving objects) and pass
    under the clouds.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d8c9a6; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* preview mode (?preview=1, settings window): translucent boxes show where the real icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.55); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="nogl">WebGL2 is not available.</div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 0;
const STEP = 5;
const MORPH_MS = 1800, ISL_FADE_MS = 1400;
const S_CLAMP = 90, D_CLAMP = 600;                     // texture clamp of the distance fields (px), CPU clamp
const CLOUD_WARP = 40;                                 // how much noise bends the cloud outline (px)
const ROSE = 84;                                       // compass rose radius (CSS px)
const NSHIP = 3;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');        // real desktop: messages from the host
const PREVIEW = QS.has('preview');       // settings window preview (iframe): messages from the parent page
// Defaults must match themes.json
const P = {
  sigma: 60, billow: 0.5, islands: 0.5, details: 0.6, life: 1, speed: 1,
  quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const KEYS = { sigma: [40, 200], billow: [0, 1], islands: [0, 1], details: [0, 1], life: [0, 1], speed: [0, 3] };
const billowPx = () => 20 + 26 * P.billow;           // lattice step of the cloud billows (CSS px)

/* ======================================================================
   Random / noise helpers (CPU)
   ====================================================================== */
/* ======================================================================
   Random / noise helpers (CPU)
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);

}

}
// Tileable noise texture (fixed, does not depend on the seed): 4 channels of fbm at different scales
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const h = (a, b) => { let v = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(k, 2246822519); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  const a = h(x0, y0), b = h(x1, y0), c = h(x0, y1), d = h(x1, y1);

function makeNoiseImage() {

  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [4, 8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let s = 0, w = 0.5, tw = 0;
      for (let j = 0; j < chans[c].length; j++) { const p = chans[c][j]; s += w * tileNoise(u * p, v * p, p, p, 100 + c * 50 + j * 13); tw += w; w *= 0.5; }

const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

const smin = (a, b, k) => { const h = Math.min(Math.max(0.5 + 0.5 * (b - a) / k, 0), 1); return b + (a - b) * h - k * h * (1 - h); };

/* ======================================================================
   Noise on the field grid (depends on the seed only)
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N), fn: new Float32Array(N),

    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0032, y * 0.0032, 1) - 0.47;        // clouds: broad bends
    NZ.wy[i] = fbm(x * 0.0032, y * 0.0032, 2) - 0.47;
    NZ.fn[i] = fbm(x * 0.012, y * 0.012, 3) - 0.47;
    NZ.iwx[i] = fbm(x * 0.006, y * 0.006, 11) - 0.47;        // islands: bends, bays and capes, a ragged shore
    NZ.iwy[i] = fbm(x * 0.006, y * 0.006, 12) - 0.47;
    NZ.ifn[i] = fbm(x * 0.017, y * 0.017, 13) - 0.47;

  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;

/* ======================================================================
   Cloud field (CPU, on icon change): s = signed distance to the cloud edge (<0 under the cloud)
   ====================================================================== */
let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = CLOUD_WARP * 2.4, wmax = wa * 0.5;
  for (const r of rects) {
    const Rf = sig * 1.1 + 150, Rf2 = Rf * Rf;
    const R = Rf + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
      const qx = x + NZ.wx[i] * wa, qy = y + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      const d2 = dx * dx + dy * dy;
      if (d2 < Rf2) f1[i] += Math.exp(-d2 * is1);

  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-60);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = Math.min(D_CLAMP, sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0) + NZ.fn[i] * CLOUD_WARP * 0.8);
  }
  // a cloud that reaches near the screen edge runs on off-screen (no billow rims along the frame)
  const M = 50, mx0 = Math.round(M / STEP), my0 = mx0, mx1 = Math.floor((W - M) / STEP), my1 = Math.floor((H - M) / STEP);
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const cx = Math.min(Math.max(gx, mx0), mx1), cy = Math.min(Math.max(gy, my0), my1);
    if (cx !== gx || cy !== gy) { const i = gy * Gw + gx, v = s[cy * Gw + cx]; if (v < s[i]) s[i] = v; }
  }
  // make it a true distance near the edge (divide by the gradient), so the billows sit evenly on every side
  const out = new Float32Array(N);
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, v = s[i];
    if (v > 400) { out[i] = v; continue; }
    const ax = gx > 0 ? s[i - 1] : v, bx = gx < Gw - 1 ? s[i + 1] : v, ay = gy > 0 ? s[i - Gw] : v, by = gy < Gh - 1 ? s[i + Gw] : v;
    const gm = Math.hypot(bx - ax, by - ay) / (2 * STEP);
    out[i] = v / (1 + (Math.min(Math.max(gm, 0.5), 2.5) - 1) * sstep(70, 25, Math.abs(v)));

  for (let i = 0; i < N; i++) s[i] = out[i] < -S_CLAMP ? -S_CLAMP : out[i];

const emptyField = () => ({ s: new Float32Array(Gw * Gh).fill(D_CLAMP) });

/* ======================================================================
   Islands (CPU, static: seed + screen size + settings), sea routes, compass position
   ====================================================================== */
let islMs = 0;
function buildIslandData() {
  const t0 = performance.now();
  let rk = 0;
  const R = () => hash2(rk++, 7, 601);

  const m = ROSE + 46, hc = R();

  const cc = cs[hc < 0.6 ? 0 : hc < 0.85 ? 1 : 2];

  const list = [];
  for (let k = 0; list.filter(o => !o.islet).length < want && k < 600; k++) {
    const big = list.length === 0 ? 1 : list.length === 1 ? 0.75 : Math.pow(R(), 1.6);
    const Rr = base * (0.03 + 0.075 * big) * sizeK * (k > 300 ? 0.6 : 1);
    const mx = 50 + Rr, my = 60 + Rr;
    if (W - 2 * mx < 10 || H - 2 * my < 10) continue;
    // best of a few candidates: the one with the most open water around it (islands spread over the chart)
    let x = 0, y = 0, best = -1e9;
    for (let c = 0; c < 10; c++) {
      const cx = mx + R() * (W - 2 * mx), cy = my + R() * (H - 2 * my);
      let room = Math.hypot(cx - compass.x, cy - compass.y) - compass.r - Rr - 46;
      for (const o of list) if (!o.islet) room = Math.min(room, Math.hypot(o.x - cx, o.y - cy) - o.R - Rr - 70);
      if (room > best) { best = room; x = cx; y = cy; }

    list.push({ x, y, R: Rr, blobs });

      const an = R() * 6.283, dd = Rr * (1.0 + 0.35 * R()), r = 7 + R() * 9;
      const ix = x + Math.cos(an) * dd, iy = y + Math.sin(an) * dd;
      if (ix > 60 && iy > 70 && ix < W - 60 && iy < H - 60 && Math.hypot(ix - compass.x, iy - compass.y) > compass.r + 30)
        list.push({ x: ix, y: iy, R: r * 1.6, blobs: [[ix, iy, r]], islet: true });
    }

  const N = Gw * Gh, s = new Float32Array(N).fill(D_CLAMP);
  for (const isl of list) {
    const wr = isl.R * 0.95, kk = isl.R * 0.3, reach = isl.R * 2.2 + 140;
    const gx0 = Math.max(0, Math.floor((isl.x - reach) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((isl.x + reach) / STEP));
    const gy0 = Math.max(0, Math.floor((isl.y - reach) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((isl.y + reach) / STEP));
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {

      let d = 1e9;

}
// connected land masses: area, coast cells, centroid, deepest point
function components(s) {

    if (s[i0] >= 0 || lab[i0] >= 0) continue;
    const id = out.length, comp = { n: 0, coast: [], sx: 0, sy: 0, deep: 0, dx: 0, dy: 0 };
    lab[i0] = id; stack.push(i0);
    while (stack.length) {
      const i = stack.pop(), x = i % Gw, y = (i / Gw) | 0;
      comp.n++; comp.sx += x * STEP; comp.sy += y * STEP;

    const r = makeRoute(s, [e.pa[0] + dx * 14, e.pa[1] + dy * 14], [e.pb[0] - dx * 14, e.pb[1] - dy * 14], 12, compass);
    if (r) { r.i = e.i; r.j = e.j; routes.push(r); e.used = true; }

    for (let k = 0; k < 60 && !routes.length; k++) {
      const a = [80 + hash2(k, 1, 91) * (W - 160), 90 + hash2(k, 2, 91) * (H - 180)];
      const b = [80 + hash2(k, 3, 91) * (W - 160), 90 + hash2(k, 4, 91) * (H - 180)];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (L < 300 || L > 900 || sampleArr(s, a[0], a[1]) < 60 || sampleArr(s, b[0], b[1]) < 60) continue;
      const r = makeRoute(s, a, b, 40, compass);
      if (r) { r.i = r.j = -1; r.open = true; routes.push(r); }
    }
  }
  return routes;
}

/* ======================================================================
   Shaders
   ====================================================================== */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uCA, uCB, uIA, uIB, uOA, uOB, uComp, uLat;
uniform vec2 uRes, uCv, uGrid, uLatN;
uniform float uScale, uSeed, uStep, uMix, uBump, uIMix, uDetail, uBill, uTime;
uniform vec4 uCompA, uCompB;     // compass: x, y, radius, weight (cross-fade when it moves)
uniform vec4 uShip[3];           // per ship: x, y, facing (+1 right / -1 left), alpha
uniform vec4 uShipB[3];          // rocking angle, flag phase, -, -
uniform vec4 uTrail[30];         // wake points (10 per ship): x, y, age (s), valid
uniform vec4 uWakeBox[3];        // bounding box of each wake (x0, y0, x1, y1)
uniform vec4 uSerp;              // sea serpent: x, y, facing, emerge (0 = hidden)
uniform float uSerpT;
uniform vec4 uKrak;              // kraken: x, y, -, emerge (0 = hidden)
uniform vec4 uGhost, uGhostB;    // ghost ship: like uShip / uShipB
uniform vec4 uTarget;            // steering: where the captain clicked: x, y, alpha, time
out vec4 o;

// ---- palette (aged parchment and sepia ink) ----
const vec3 SEA = vec3(0.835, 0.815, 0.715), SEA_D = vec3(0.77, 0.75, 0.65);
const vec3 LAND = vec3(0.81, 0.70, 0.51), LAND_D = vec3(0.75, 0.63, 0.44);
const vec3 INK = vec3(0.23, 0.15, 0.09), RED = vec3(0.62, 0.21, 0.14);
const vec3 BURN = vec3(0.17, 0.09, 0.04);
const vec3 CLOUD = vec3(0.94, 0.91, 0.835), CLOUD_SH = vec3(0.865, 0.825, 0.74);
const vec2 SH_OFF = vec2(7.0, 9.0);

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
vec2 fuv(vec2 p) { return (p / uStep + 0.5) / uGrid; }
float isl(vec2 p) { vec2 uv = fuv(p); return mix(texture(uIA, uv).r, texture(uIB, uv).r, uIMix); }
// cloud field on screen: from -> to, pushed outward mid-way where the two differ (see bumpK in the script)
float cfield(vec2 p) { vec2 uv = fuv(p); float a = texture(uCA, uv).r, b = texture(uCB, uv).r; return mix(a, b, uMix) + uBump * abs(a - b); }
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float AA;                                                    // half a device pixel in CSS px
float stroke(float d, float w) { return 1.0 - ss(w - AA, w + AA, abs(d)); }
float fillD(float d) { return 1.0 - ss(-AA, AA, d); }
// iq's triangle distance
float triD(vec2 p, vec2 p0, vec2 p1, vec2 p2) {
  vec2 e0 = p1 - p0, e1 = p2 - p1, e2 = p0 - p2, v0 = p - p0, v1 = p - p1, v2 = p - p2;
  vec2 pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  vec2 pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  vec2 pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  float s = sign(e0.x * e2.y - e0.y * e2.x);
  vec2 d = min(min(vec2(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)), vec2(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
               vec2(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}

// engraved wave marks on the open sea: little "~" strokes on a staggered grid (static)
float waveMarks(vec2 p, float s) {
  float dens = uDetail * ss(24.0, 52.0, s) * (0.2 + 0.8 * ss(0.32, 0.62, N(p, 520.0).g));
  if (dens <= 0.0) return 0.0;
  const vec2 G = vec2(34.0, 21.0);
  float row = floor(p.y / G.y);
  vec2 q = p + vec2(mod(row, 2.0) * G.x * 0.5, 0.0);
  vec2 c = floor(q / G);
  if (hash2(c + 5.3) > dens * 0.9) return 0.0;
  vec2 l = q - (c + 0.5) * G - (vec2(hash2(c + 1.1), hash2(c + 2.3)) - 0.5) * vec2(12.0, 6.0);
  float ink = 0.0;
  for (int k = 0; k < 2; k++) {
    vec2 m = k == 0 ? l : (l - vec2(2.5, 3.4)) * 1.5;
    float L = 6.3;
    if (abs(m.x) > L + 1.0) continue;
    float f = -1.25 * sin(m.x * 0.5), fd = -0.625 * cos(m.x * 0.5);
    float d = abs(m.y - f) / sqrt(1.0 + fd * fd);
    float w = 0.48 * (1.0 - pow(clamp(abs(m.x) / L, 0.0, 1.0), 2.0)) + 0.06;
    ink = max(ink, stroke(d, w) * (k == 0 ? 1.0 : 0.7) * step(abs(m.x), L));
  }
  return ink * (0.55 + 0.25 * hash2(c + 7.7));
}
// stippling along the inside of the coast
float stipple(vec2 p, float sd) {
  float dens = (0.3 + 0.8 * uDetail) * ss(-24.0, -1.5, sd) * (0.6 + 0.6 * N(p, 160.0).b);
  if (dens <= 0.0) return 0.0;
  const float G = 4.2;
  vec2 c = floor(p / G);
  if (hash2(c + 4.1) > dens * dens * 0.85) return 0.0;
  vec2 l = p - (c + 0.5) * G - (vec2(hash2(c + 0.3), hash2(c + 1.7)) - 0.5) * 2.0;
  float r = 0.42 + 0.22 * hash2(c + 2.9);
  return fillD(length(l) - r) * 0.8;
}

// ---------- the little ships (side view, local coordinates; y down, waterline at y = 5) ----------
void shipDraw(inout vec3 col, vec2 p, vec4 S, vec4 SB, float g) {
  if (S.w <= 0.0) return;
  vec2 q0 = (p - S.xy) / 0.82;
  if (dot(q0, q0) > 1600.0) return;
  vec2 q = q0; q.x *= S.z;
  q = rot(SB.x) * (q - vec2(0.0, 5.0)) + vec2(0.0, 5.0);
  float a = S.w;
  // ghost ship: pale, see-through, a faint glow around it, torn sails, no colours
  vec3 INK = mix(INK, vec3(0.30, 0.38, 0.34), g);
  vec3 RED = mix(RED, vec3(0.20, 0.22, 0.20), g);
  if (g > 0.0) {
    col = mix(col, vec3(0.88, 0.93, 0.86), 0.32 * a * exp(-dot(q0 - vec2(0.0, -11.0), q0 - vec2(0.0, -11.0)) / 260.0));
    a *= 0.62 + 0.1 * sin(SB.z * 1.7) + 0.06 * sin(SB.z * 4.3);
  }
  // hull with a raised stern castle
  float top = q.x < -6.0 ? -4.0 : -0.6;
  float xl = -12.5 + (q.y + 4.0) * 0.45, xr = 13.0 - (q.y + 0.6) * 0.95;
  float hd = max(max(top - q.y, q.y - 5.0), max(xl - q.x, q.x - xr));
  // masts and sails
  float mast = min(segD(q, vec2(0.5, -0.6), vec2(0.5, -27.0)), segD(q, vec2(7.5, -0.6), vec2(7.5, -20.0)));
  float bsp = segD(q, vec2(12.0, -1.0), vec2(19.0, -4.5));
  vec2 sm = q - vec2(0.5, -15.5);                                       // main sail, billowing
  float smd = max(abs(sm.x) - 6.0 - 0.6 * (sm.y + 7.0) / 7.0, max(-7.0 - sm.y, sm.y - 7.0 - 1.6 * (1.0 - sm.x * sm.x / 36.0)));
  vec2 st = q - vec2(0.5, -23.6);                                       // top sail
  float std_ = max(abs(st.x) - 4.2 - 0.3 * (st.y + 2.5) / 2.5, max(-2.5 - st.y, st.y - 2.5 - 0.9 * (1.0 - st.x * st.x / 17.0)));
  vec2 sf = q - vec2(7.5, -12.0);                                       // fore sail
  float sfd = max(abs(sf.x) - 4.0 - 0.4 * (sf.y + 5.5) / 5.5, max(-5.5 - sf.y, sf.y - 5.5 - 1.2 * (1.0 - sf.x * sf.x / 16.0)));
  float jib = triD(q, vec2(8.6, -19.0), vec2(18.0, -4.6), vec2(9.5, -6.5));
  float flag = triD(q, vec2(0.5, -27.2), vec2(0.5, -24.6), vec2(6.5 + 0.6 * sin(SB.y), -25.9 + 0.5 * sin(SB.y * 1.3)));
  vec3 SAIL = mix(vec3(0.95, 0.91, 0.80), vec3(0.90, 0.94, 0.88), g);
  // little ripples where the hull meets the sea
  float rip = max(stroke(segD(q, vec2(-17.0, 6.0), vec2(-12.5, 6.0)), 0.4), stroke(segD(q, vec2(13.0, 6.0), vec2(19.5, 6.0)), 0.4));
  rip = max(rip, stroke(segD(q, vec2(-14.0, 8.0), vec2(-9.0, 8.0)), 0.35) * 0.7);
  col = mix(col, INK, rip * 0.6 * a);
  // back to front: jib, main + top sail, fore sail, masts, hull, flag
  col = mix(col, SAIL, fillD(jib) * a);
  col = mix(col, INK, stroke(jib, 0.5) * a);
  col = mix(col, INK, stroke(mast, 0.5) * a);
  col = mix(col, INK, stroke(bsp, 0.5) * a);
  for (int j = 0; j < 3; j++) {
    float d = j == 0 ? smd : j == 1 ? std_ : sfd;
    vec2 l = j == 0 ? sm : j == 1 ? st : sf;
    vec3 sc = SAIL;
    // engraved shading lines on the right part of each sail
    float hl = stroke(fract(l.x / 1.5) * 1.5 - 0.75, 0.24) * ss(0.5, 3.5, l.x + (j == 0 ? 0.0 : 1.0));
    sc = mix(sc, INK, hl * 0.55);
    // torn sails: holes and a ragged lower edge
    float torn = g * max(step(0.74, hash2(floor(l * 0.75) + float(j) * 7.0)), step(l.y, 9.0) * step(5.0 - 2.0 * hash2(vec2(floor(l.x * 0.9), float(j))), l.y));
    col = mix(col, sc, fillD(d) * a * (1.0 - torn));
    col = mix(col, INK, stroke(d, 0.5) * a * (1.0 - 0.6 * torn));
  }
  vec3 hull = mix(vec3(0.52, 0.35, 0.20), vec3(0.40, 0.26, 0.15), ss(1.0, 4.0, q.y));
  hull = mix(hull, mix(vec3(0.70, 0.75, 0.69), vec3(0.58, 0.64, 0.58), ss(1.0, 4.0, q.y)), g);
  hull = mix(hull, INK, stroke(q.y - 1.6, 0.35) * 0.8);
  for (int j = 0; j < 3; j++) hull = mix(hull, vec3(0.22, 0.14, 0.08), fillD(length(q - vec2(-5.0 + float(j) * 4.5, 0.4)) - 0.6)); // gun ports
  col = mix(col, hull, fillD(hd) * a);
  col = mix(col, INK, stroke(hd, 0.55) * a);
  col = mix(col, RED, fillD(flag) * a);
}
void ship(inout vec3 col, vec2 p, int k) { shipDraw(col, p, uShip[k], uShipB[k], 0.0); }

// ---------- the kraken: tentacles curling out of the sea around a dome-shaped head ----------
void kraken(inout vec3 col, vec2 p) {
  float e = uKrak.w;
  if (e <= 0.0) return;
  vec2 q = p - uKrak.xy;
  if (abs(q.x) > 95.0 || q.y > 22.0 || q.y < -80.0) return;
  vec3 SKIN = vec3(0.60, 0.36, 0.30), SKIN_D = vec3(0.45, 0.25, 0.21), SUCK = vec3(0.86, 0.72, 0.58);
  float T = uSerpT;
  // rings in the water around everything that breaks the surface
  float rip = 0.0;
  for (int k = 0; k < 6; k++) {
    float bx = -70.0 + float(k) * 28.0;
    vec2 r = q - vec2(bx, 1.4);
    float d = abs(length(r * vec2(1.0, 2.6)) - (8.0 + 4.0 * e + 1.5 * sin(T * 1.3 + float(k)))) / 2.0;
    rip = max(rip, stroke(d, 0.3) * step(0.0, r.y + 0.6));
  }
  col = mix(col, INK, rip * 0.5 * e);
  float above = ss(0.6, -0.6, q.y);
  if (above <= 0.0) return;
  // head: a dome rising in the middle, with two eyes
  vec2 hc = vec2(0.0, 6.0 + (1.0 - e) * 30.0);
  vec2 hl = (q - hc) * vec2(1.0, 0.82);
  float head = length(hl) - 21.0;
  vec3 hcCol = mix(SKIN, SKIN_D, ss(-10.0, 12.0, hl.x + hl.y * 0.4));
  hcCol = mix(hcCol, SKIN_D, stroke(fract(length(hl - vec2(-6.0, -10.0)) / 4.0) - 0.5, 0.08) * 0.6);   // engraved rings
  col = mix(col, hcCol, fillD(head) * above * e);
  col = mix(col, INK, stroke(head, 0.55) * above * e);
  for (int s = -1; s <= 1; s += 2) {
    vec2 ec = hc + vec2(float(s) * 8.0, -9.0);
    float blink = 0.5 + 0.5 * step(0.04, fract(T * 0.13 + float(s) * 0.02));
    float eye = length((q - ec) * vec2(1.0, 1.0 / max(blink, 0.15))) - 3.3;
    col = mix(col, vec3(0.93, 0.86, 0.55), fillD(eye) * above * e);
    col = mix(col, INK, stroke(eye, 0.4) * above * e);
    col = mix(col, INK, fillD(length((q - ec) * vec2(2.4, 1.0)) - 2.2) * above * e * blink);
  }
  // tentacles: tapered curves that rise, sway and curl at the tip
  for (int k = 0; k < 6; k++) {
    float fk = float(k);
    float bx = (k < 3 ? -1.0 : 1.0) * (30.0 + 21.0 * mod(fk, 3.0));
    float side = bx < 0.0 ? -1.0 : 1.0;
    float L = (44.0 + 16.0 * fract(fk * 0.618 + 0.3)) * e;
    float ph = T * (0.55 + 0.1 * fk) + fk * 1.9;
    vec2 prev = vec2(bx, 2.0);
    float best = 1e9, sd = 1e9;
    for (int i = 1; i <= 12; i++) {
      float s = float(i) / 12.0;
      float curl = ss(0.55, 1.0, s);
      float ang = -1.5708 + side * (0.25 + 0.35 * sin(ph + s * 2.2)) * s - side * curl * (3.8 + 0.6 * sin(ph * 0.7));
      vec2 nxt = prev + vec2(cos(ang), sin(ang)) * L / 12.0 * (1.0 - 0.35 * curl);
      float d = segD(q, prev, nxt);
      float w = mix(5.2, 0.9, s);
      best = min(best, d - w);
      // a row of suckers on the inner side
      vec2 dir = normalize(nxt - prev + 1e-4), nrm = vec2(-dir.y, dir.x) * side;
      if (i > 1 && i < 12) sd = min(sd, length(q - (prev + nxt) * 0.5 + nrm * w * 0.5) - w * 0.33);
      prev = nxt;
    }
    vec3 tc = mix(SKIN, SKIN_D, ss(-2.0, 3.0, best + 3.0));
    tc = mix(tc, SUCK, fillD(sd) * 0.9);
    tc = mix(tc, SKIN_D, stroke(sd, 0.25) * 0.8);
    float te = above * ss(0.0, 0.25, e);
    col = mix(col, tc, fillD(best) * te);
    col = mix(col, INK, stroke(best, 0.5) * te);
  }
}
// the faint wake: two lines spreading behind a ship as they age
void wake(inout vec3 col, vec2 p, int k) {
  vec4 B0 = uWakeBox[k];
  if (uShip[k].w <= 0.0 || p.x < B0.x || p.y < B0.y || p.x > B0.z || p.y > B0.w) return;
  float ink = 0.0;
  for (int i = 0; i < 9; i++) {
    vec4 A = uTrail[k * 10 + i], B = uTrail[k * 10 + i + 1];
    if (A.w <= 0.0 || B.w <= 0.0) continue;
    vec2 ba = B.xy - A.xy;
    float L2 = dot(ba, ba);
    if (L2 < 0.01) continue;
    float t = clamp(dot(p - A.xy, ba) / L2, 0.0, 1.0);
    vec2 off = p - A.xy - ba * t;
    float d = length(off);
    float age = mix(A.z, B.z, t);
    float spread = 1.4 + age * 1.0;
    float kk = 0.5 * (1.0 - ss(0.0, 7.0, age)) * ss(0.0, 0.8, age);
    ink = max(ink, stroke(d - spread, 0.32 + age * 0.03) * kk);
  }
  col = mix(col, INK, ink * uShip[k].w);
}
// ---------- a sea serpent surfacing in open water (local coordinates, waterline at y = 0) ----------
void serpent(inout vec3 col, vec2 p) {
  float e = uSerp.w;
  if (e <= 0.0) return;
  vec2 q = p - uSerp.xy;
  if (abs(q.x) > 52.0 || abs(q.y) > 34.0) return;
  q.x *= uSerp.z;
  vec3 BODY = vec3(0.45, 0.53, 0.38);
  // rings in the water around the body (they grow while it surfaces)
  float rip = 0.0;
  for (int k = 0; k < 4; k++) {
    float x0 = -30.0 + float(k) * 17.0;
    vec2 r = q - vec2(x0, 1.2);
    float d = abs(length(r * vec2(1.0, 2.4)) - (9.0 + 3.0 * e)) / 2.0;
    rip = max(rip, stroke(d, 0.3) * step(0.0, r.y + 0.6));
  }
  col = mix(col, INK, rip * 0.55 * e);
  // three humps: half rings rising out of the water
  for (int k = 0; k < 3; k++) {
    float R = k == 1 ? 7.6 : 6.6;
    vec2 c = vec2(-30.0 + float(k) * 17.0, (1.0 - e) * (R + 4.0) + 0.6 * sin(uSerpT * 0.7 + float(k) * 1.7));
    vec2 l = q - c;
    float d = abs(length(l) - R) - 2.5;
    float above = ss(0.6, -0.6, q.y);
    if (above <= 0.0) continue;
    float ang = atan(l.y, l.x);
    vec3 bc = mix(BODY, BODY * 0.7, stroke(fract(ang * 2.2) - 0.5, 0.12));        // scale bands
    bc = mix(bc, BODY * 1.2, ss(0.0, -2.5, length(l) - R) * 0.3);
    col = mix(col, bc, fillD(d) * above * e);
    col = mix(col, INK, stroke(d, 0.45) * above * e);
  }
  // neck and head with a fin and an eye
  float hy = (1.0 - e) * 20.0;
  vec2 hc = vec2(22.0, -15.0 + hy + 0.6 * sin(uSerpT * 0.6));
  float neck = segD(q, vec2(17.0, 2.0 + hy * 0.2), hc + vec2(-2.0, 3.0)) - 2.8;
  vec2 hl = (q - hc - vec2(2.5, 0.0)) * vec2(1.0, 1.55);
  float head = length(hl) - 4.6;
  float jaw = triD(q, hc + vec2(3.0, -1.0), hc + vec2(12.0, 1.5), hc + vec2(3.0, 3.0));
  float fin = triD(q, hc + vec2(-3.0, -2.0), hc + vec2(-0.5, -8.0), hc + vec2(1.5, -3.2));
  float body = min(min(neck, head), jaw);
  float above = ss(0.6, -0.6, q.y);
  col = mix(col, BODY * 0.85, fillD(fin) * above * e);
  col = mix(col, INK, stroke(fin, 0.4) * above * e);
  col = mix(col, BODY, fillD(body) * above * e);
  col = mix(col, INK, stroke(body, 0.45) * above * e);
  col = mix(col, INK, fillD(length(q - hc - vec2(3.6, -1.0)) - 0.8) * above * e);
}

// ---------- the clouds over the icons ----------
// Distance to the cloud (<0 inside): the field's body, unioned with billows from two interleaved FIXED lattices of
// circles (one jittered centre per cell, stable per seed; radii computed on the CPU, see updateLattice). A circle's
// radius follows the field at its own centre, so the scallops swell and shrink smoothly and never slide along the edge.
// full = true also finds the front-most billow covering p (lowest centre = nearest the viewer) and the ink of the
// billow arcs that are visible here.
float cloudAt(vec2 p, bool full, out vec4 fr, out float arcs) {
  float G = uBill;
  // the body: field distance normalised by its gradient, so the outline stays a crisp line even where the field
  // is flat (mid-transition) instead of smearing into a wide band of ink
  float d = cfield(p);
  vec2 gq = vec2(cfield(p + vec2(3.0, 0.0)) - cfield(p - vec2(3.0, 0.0)), cfield(p + vec2(0.0, 3.0)) - cfield(p - vec2(0.0, 3.0))) / 6.0;
  float gm = length(gq), gk = 1.0 / clamp(gm, 0.15, 2.0), go = (1.0 - ss(0.12, 0.4, gm)) * 0.7 * G;
  d = d * gk + go;                                                // (flat slivers just melt away)
  fr = vec4(0.0, -1e9, 0.0, 0.0); arcs = 0.0;
  vec4 cs[18];
  ivec2 LN = ivec2(uLatN);
  for (int L = 0; L < 2; L++) {
    ivec2 cell = ivec2(floor(p / G - float(L) * 0.5)) + 1;
    for (int j = 0; j < 9; j++) {
      ivec2 ci = cell + ivec2(j % 3 - 1, j / 3 - 1);
      vec4 c = vec4(0.0);
      if (ci.x >= 0 && ci.y >= 0 && ci.x < LN.x && ci.y < LN.y) c = texelFetch(uLat, ivec2(ci.x + L * LN.x, ci.y), 0);
      cs[L * 9 + j] = c;
      if (c.z <= 0.0) continue;
      float di = length(p - c.xy) - c.z;
      d = min(d, di);
      if (full && di < 0.0 && c.y > fr.y) fr = vec4(c.xyz, c.w > 5e3 ? c.w - 1e4 : c.w);
    }
  }
  if (full) {

  tgt.a = c.goto ? Math.min(1, tgt.a + dt * 4) : Math.max(0, tgt.a - dt * 3);
  // nobody at the helm for two minutes: the ship goes back to its own business
  c.idle = (al || Math.hypot(c.vx, c.vy) > 2) ? 0 : c.idle + dt;
  if (c.idle > 120) releaseShip(true);
}
const shipWant = () => ISL && ISL.routes.length ? Math.min(NSHIP, ISL.routes.length + 1) : 0;
// new island layout: the ships fade out and turn up on the new routes
function shipsNewIslands(fade) {
  for (const s of ships) {
    if (fade && s.route) s.out = true;
    else { s.route = null; s.alpha = 0; s.trail = []; s.out = false; }
  }
}
function pickRoute(s, island) {
  const routes = ISL.routes, busy = new Set(ships.filter(o => o !== s && o.route).map(o => o.route));
  let cand = island == null ? routes : routes.filter(r => r.i === island || r.j === island);
  if (!cand.length) cand = routes;
  const fresh = cand.filter(r => !busy.has(r) && r !== s.route);
  if (fresh.length && (Math.random() < 0.8 || cand.length === 1)) cand = fresh;
  else { const nb = cand.filter(r => !busy.has(r)); if (nb.length) cand = nb; }
  return cand[Math.floor(Math.random() * cand.length)];
}
function spawnShip(s) {
  const r = pickRoute(s, null);
  s.route = r; s.dir = Math.random() < 0.5 ? 1 : -1;
  s.t = r.len * (0.15 + 0.7 * Math.random());
  s.phase = 'sail'; s.trail = []; s.alpha = 0;
}
function stepShips(t, dt) {
  const show = P.life >= 0.5, want = shipWant();
  ships.forEach((s, k) => {
    if (ctl && ctl.s === s) {
      if (!show || s.out || !s.route) releaseShip(true);
      else { stepCtl(s, t, rawDt); return; }
    }
    if (s.phase === 'home') { stepHome(s, t, rawDt); return; }
    if (!show || k >= want) { if (s.route) s.out = true; }
    if (s.out) {
      s.alpha = Math.max(0, s.alpha - dt / 1.4);
      if (s.alpha <= 0) { s.route = null; s.out = false; s.trail = []; s.delay = 1 + Math.random() * 3; }
    } else if (!s.route && show && k < want) {
      s.delay -= dt;
      if (s.delay <= 0) spawnShip(s);
    }
    if (!s.route) return;
    const r = s.route;
    if (s.phase === 'sail') {
      if (!s.out) s.alpha = Math.min(1, s.alpha + dt / 1.6);
      s.t += s.dir * 10 * dt;
      if (s.t <= 0 || s.t >= r.len) { s.t = Math.min(Math.max(s.t, 0), r.len); s.phase = 'port'; s.timer = 4 + Math.random() * 6; }
    } else if (s.phase === 'port') {
      s.timer -= dt;
      if (s.timer <= 0) {
        // set sail again: back the same way, or (dissolving into the harbour) out along another route
        const at = s.dir > 0 ? r.j : r.i, nx = r.open ? r : pickRoute(s, at);
        if (nx === r) { s.dir = -s.dir; s.phase = 'sail'; }
        else { s.next = nx; s.nextAt = at; s.phase = 'swap'; }
      }
    } else if (s.phase === 'swap') {
      s.alpha = Math.max(0, s.alpha - dt / 1.2);
      if (s.alpha <= 0) {
        const nx = s.next;
        s.route = nx; s.dir = nx.i === s.nextAt ? 1 : -1; s.t = s.dir > 0 ? 0 : nx.len;
        s.trail = []; s.phase = 'sail';
      }
    }
    const R2 = s.route, q = routeAt(R2, s.t);
    const vx = q[2] * s.dir;
    if (s.phase === 'sail' && Math.abs(vx) > 0.15 * Math.hypot(q[2], q[3])) s.face = vx > 0 ? 1 : -1;
    s.x = q[0]; s.y = q[1] - 4;                        // the hull sits on the route line
    s.trailT += dt;
    if (s.trailT > 0.7) {
      s.trailT = 0;
      if (s.phase === 'sail') s.trail.push({ x: q[0], y: q[1] + 1, t });
    }
  });
  trailU.fill(0); shipU.fill(0);
  ships.forEach((s, k) => {
    s.trail = s.trail.filter(p => t - p.t < 7);
    if (s.trail.length > 9) s.trail.shift();
    const pts = s.trail.map(p => [p.x, p.y, t - p.t]);
    if (s.route && (s.phase === 'sail' || s.phase === 'ctl' || s.phase === 'home')) pts.push([s.x, s.y + 5, 0]);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    pts.slice(-10).forEach((p, i) => {
      trailU.set([p[0], p[1], p[2], 1], (k * 10 + i) * 4);
      x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
    });
    wakeU.set([x0 - 12, y0 - 12, x1 + 12, y1 + 12], k * 4);
    shipU.set([s.x, s.y, s.face, s.route ? s.alpha : 0], k * 4);
    shipBU.set([0.05 * Math.sin(t * 0.9 + s.ph) + 0.025 * Math.sin(t * 0.53 + 1 + s.ph * 1.7), t * 2.2 + s.ph, 0, 0], k * 4);
  });
}
function stepLife(t, dt) {
  const show = P.life >= 0.5;
  stepShips(t, dt);
  // ---- sea serpent: open water, away from the islands, the clouds, the ships and the compass ----
  serp.ph += dt;
  if (serp.phase === 'wait') {
    serp.timer -= dt;
    serp.e = 0;
    if (serp.timer <= 0 && show) {
      const kind = FORCE ? ['serpent', 'kraken', 'ghost'].indexOf(FORCE) : [0, 0, 1, 1, 2][Math.floor(Math.random() * 5)];
      let pt = null;
      for (let k = 0; k < 80 && !pt && ISL; k++) {
        const x = 110 + Math.random() * (W - 220), y = 110 + Math.random() * (H - 220);
        if (kind === 0 && openSea(x, y, 95)) pt = [x, y];
        else if (kind === 1 && openSea(x, y - 25, 90) && openSea(x - 55, y - 15, 50) && openSea(x + 55, y - 15, 50)) pt = [x, y];
        else if (kind === 2) {
          // the ghost ship drifts ~170 px in a straight line: the whole way must be open sea
          const a = Math.random() < 0.5 ? 0 : Math.PI, dx = Math.cos(a + (Math.random() - 0.5) * 0.5), dy = Math.sin(a + (Math.random() - 0.5) * 0.5);
          let ok = true;
          for (let s = 0; s <= 170 && ok; s += 34) ok = openSea(x + dx * s, y + dy * s - 10, 60);
          if (ok) { pt = [x, y]; serp.gdx = dx; serp.gdy = dy; }
        }
      }
      if (pt) {
        serp.kind = kind; serp.phase = 'up'; serp.timer = 0;
        if (kind === 0) { serp.x = pt[0]; serp.y = pt[1]; serp.dir = Math.random() < 0.5 ? 1 : -1; }
        else if (kind === 1) { serp.kx = pt[0]; serp.ky = pt[1]; }
        else { serp.gx = pt[0]; serp.gy = pt[1]; }
      } else serp.timer = 8;
    }
  } else {
    serp.timer += dt;
    // serpent: surfaces 5 s, swims 11 s, dives 5 s; kraken: rises 4 s, waves 12 s, sinks 5 s;
    // ghost ship: fades in out of the mist 4 s, drifts 18 s, fades away 5 s
    const [tUp, tStay, tDown] = [[5, 11, 5], [4, 12, 5], [4, 18, 5]][serp.kind];
    let e;
    if (serp.phase === 'up') { e = sstep(0, tUp, serp.timer); if (serp.timer > tUp) { serp.phase = 'stay'; serp.timer = 0; } }
    else if (serp.phase === 'stay') { e = 1; if (serp.timer > tStay || !show) { serp.phase = 'down'; serp.timer = 0; } }
    else { e = 1 - sstep(0, tDown, serp.timer); if (serp.timer > tDown) { serp.phase = 'wait'; serp.timer = LIFETEST ? 3 : 60 + Math.random() * 70; e = 0; } }
    serp.e = serp.ke = serp.ga = 0;
    if (serp.phase === 'wait') return;
    if (serp.kind === 0) { serp.e = e; serp.x += serp.dir * 2.2 * dt; }
    else if (serp.kind === 1) serp.ke = e;
    else { serp.ga = e; serp.gx += serp.gdx * 6.5 * dt; serp.gy += serp.gdy * 6.5 * dt; }
  }
}

/* ======================================================================
   Frame loop
   ====================================================================== */
function resize() {
  W = innerWidth; H = innerHeight;
  const scale = PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, P.quality);
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
  buildCompass();
  buildIslands(false);
  LAT = null;
}

const T0 = performance.now();
let lastT = 0, fpsEMA = 0, frameN = 0, frameMs = 0, lifeT = 0;
let paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 31) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  if (lastT) fpsEMA = fpsEMA ? fpsEMA * 0.9 + (1 / dt) * 0.1 : 1 / dt;
  lastT = now;
  const sdt = dt * P.speed;
  rawDt = dt;
  lifeT += sdt;
  stepLife(lifeT, sdt);
  draw(now);
  frameN++;
}
const ease = e => e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
let ovW = 0, ovH = 0;
function draw(now) {
  const t0 = performance.now();
  curMix = ease(Math.min(Math.max((now - morphT0) / morphDur, 0), 1));
  islMix = ease(Math.min(Math.max((now - islT0) / ISL_FADE_MS, 0), 1));
  if (ovW !== cv.width || ovH !== cv.height) { ovW = cv.width; ovH = cv.height; refreshOverlays(); }
  const { p, U } = PR;
  gl.useProgram(p);
  gl.viewport(0, 0, cv.width, cv.height);
  const prev = 1 - islCur;
  if (!LAT || LAT.G !== billowPx()) buildLattice();
  updateLattice(lifeT);
  const tex = [noiseTex, ftex[fromI], ftex[toI], itex[prev], itex[islCur], otex[prev], otex[islCur], compTex, latTex];
  ['uNoise', 'uCA', 'uCB', 'uIA', 'uIB', 'uOA', 'uOB', 'uComp', 'uLat'].forEach((nm, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex[i]); gl.uniform1i(U[nm], i);
  });
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);
  gl.uniform2f(U.uCv, cv.width, cv.height);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform2f(U.uLatN, LAT.nx, LAT.ny);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (seed % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uBump, bumpAt(curMix));
  gl.uniform1f(U.uIMix, islMix);
  gl.uniform1f(U.uDetail, P.details);
  gl.uniform1f(U.uBill, billowPx());
  gl.uniform1f(U.uTime, lifeT);
  const ca = islF[prev] && islF[prev].compass, cb = islF[islCur] && islF[islCur].compass;
  const same = ca && cb && Math.abs(ca.x - cb.x) + Math.abs(ca.y - cb.y) + Math.abs(ca.r - cb.r) < 0.5;
  gl.uniform4f(U.uCompA, ca ? ca.x : 0, ca ? ca.y : 0, ca ? ca.r : 1, ca && !same ? 1 - islMix : 0);
  gl.uniform4f(U.uCompB, cb ? cb.x : 0, cb ? cb.y : 0, cb ? cb.r : 1, cb ? (same ? 1 : islMix) : 0);
  gl.uniform4fv(U.uShip, shipU);
  gl.uniform4fv(U.uShipB, shipBU);
  gl.uniform4fv(U.uTrail, trailU);
  gl.uniform4fv(U.uWakeBox, wakeU);
  gl.uniform4f(U.uSerp, serp.x, serp.y, serp.dir, serp.e);
  gl.uniform1f(U.uSerpT, serp.ph);
  gl.uniform4f(U.uKrak, serp.kx, serp.ky, 0, serp.ke);
  if (ctl && ctl.goto) { tgt.x = ctl.goto[0]; tgt.y = ctl.goto[1]; }
  gl.uniform4f(U.uTarget, tgt.x, tgt.y, tgt.a, lifeT);
  gl.uniform4f(U.uGhost, serp.gx, serp.gy - 4, serp.gdx >= 0 ? 1 : -1, serp.ga);
  gl.uniform4f(U.uGhostB, 0.06 * Math.sin(serp.ph * 0.8) + 0.03 * Math.sin(serp.ph * 0.47 + 1), serp.ph * 1.6, serp.ph, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frameMs = performance.now() - t0;
}

/* ======================================================================
   Settings / hosted mode
   ====================================================================== */
let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise(); LAT = null;
  buildIslands(true);
  if (iconsSeen && FB) commit(); else refresh();
}
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, isl = false;
  for (const k in v) {
    if (!KEYS[k] || typeof v[k] !== 'number' || !isFinite(v[k]) || P[k] === v[k]) continue;
    const [lo, hi] = KEYS[k];
    P[k] = Math.min(Math.max(v[k], lo), hi);
    if (k === 'sigma') field = true;
    if (k === 'islands' || k === 'details') isl = true;
  }
  if (isl) buildIslands(true);
  if (field && FB) commit();                      // cloud size: smooth transition too
}
function drawGhosts() {
  const box = document.getElementById('ghosts');
  if (box) box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  refresh();                                     // open sea until we know where the icons are
  let first = true;
  const handle = m => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'pick') { pickShip(+m.x, +m.y); return; }
    if (m.t === 'key') { if (ctl) ctl.keys[m.k] = !!m.v; return; }
    if (m.t === 'goto') { if (ctl) ctl.goto = [+m.x, +m.y - 4]; return; }
    if (m.t === 'steer') { if (!m.on) releaseShip(false); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical -> CSS pixels
    icons = m.vis && Array.isArray(m.r) ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: clouds grow in; later: smooth transition
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) { try { handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); } catch (e) {} } });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => { try { handle(JSON.parse(ev.data)); } catch (e) { console.error(e); } });
  host.postMessage('ready');
}
function startDemo() {
  // plain browser: a column of icons on the right and a few scattered ones
  const list = [];
  for (let r = 0; r < 6; r++) list.push({ x: W - 90, y: 10 + r * 100, w: 76, h: 92 });
  list.push({ x: W * 0.22, y: H * 0.3, w: 76, h: 92 }, { x: W * 0.45, y: H * 0.62, w: 76, h: 92 }, { x: W * 0.52, y: H * 0.18, w: 76, h: 92 });
  icons = list;
  commit(true);
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); refresh(); }, 100);
});

window.__dbg = { P, stats: () => ({ fieldMs, islMs, latMs, ovMs, frameMs, fps: fpsEMA, islands: ISL && ISL.comps.length, routes: ISL && ISL.routes.length }) };
buildNoiseTex();
resize();
if (WALL || PREVIEW) startHostedMode();
else startDemo();
requestAnimationFrame(frame);
</script>
