<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconland · Cloud Sky</title>
<!--
  Iconland · Cloud Sky theme (cheerful flat-cartoon sky; pure WebGL2, one full-screen pass)
  - Cloud field (CPU, only when icons change): gaussian metaballs + noise warp -> signed distance s (<0 = inside a cloud).
  - Cartoon puffs: one jittered puff per grid cell, sized on the CPU from the field (big on the cloud's upper rim,
    small on the flat bottom, none outside). The shader unions the smooth body with the 3x3 nearby puffs, then
    cel-shades it: flat body, a crisp shade band along the bottom, a lit rim on top and a clean outline.
  - Sky follows the Mac's local clock (or a fixed choice): day blue with a cartoon sun, dusk/dawn orange-pink with a
    low sun, night navy with twinkling stars, a crescent moon and a rare shooting star. Changes cross-fade smoothly.
  - Life: little background clouds drifting in three parallax layers, a hot-air balloon that slowly floats across now
    and then, small flocks of birds by day (all drawn as tiny SDFs from a handful of uniforms).
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6fa8e6; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* preview mode (?preview=1, settings window): translucent boxes show where the real icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.55); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="nogl">WebGL2 is not available.</div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 0;
const STEP = 5;
const MORPH_MS = 1800;
const WARP = 30;                         // how much the cloud outline is bent by noise (px)
const S_FAR = 400;                       // field clamp far from every icon (also the "empty sky" value)

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');        // real desktop: messages from the host
const PREVIEW = QS.has('preview');       // settings window preview (iframe): messages from the parent page
// Defaults must match themes.json
const P = {
  sigma: 64,        // cloud size around the icons (px)
  cover: 0.5,       // amount of little background clouds
  tod: 0,           // time of day: 0 auto (local clock), 1 day, 2 dusk, 3 night
  speed: 1,         // animation speed
  quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const KEYS = { sigma: [40, 200], cover: [0, 1], tod: [0, 3], speed: [0, 3] };

/* ======================================================================
   Random / noise helpers (CPU)
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
// Tileable noise texture (fixed): 4 channels of fbm at different scales
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const h = (a, b) => { let v = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(k, 2246822519); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  const a = h(x0, y0), b = h(x1, y0), c = h(x0, y1), d = h(x1, y1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[4, 8, 16, 32], [8, 16, 32, 64], [2, 4, 8, 16], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let s = 0, w = 0.5, tw = 0;
      for (let j = 0; j < chans[c].length; j++) { const p = chans[c][j]; s += w * tileNoise(u * p, v * p, p, p, 100 + c * 50 + j * 13); tw += w; w *= 0.5; }
      d[i + c] = Math.min(Math.max((s / tw - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

/* ======================================================================
   Cloud field (CPU): s = signed distance to the cloud edge (<0 inside)
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0035, y * 0.0035, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0035, y * 0.0035, 2) - 0.47;
  }
}
let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = WARP * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      // clouds are wider than tall: squash the vertical distance a little
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa * 0.6;
      let dx = Math.abs(qx - r.cx) - chw, dy = (Math.abs(qy - r.cy) - chh) * 1.12;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = Math.min(S_FAR, sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0));
  }
  fieldMs = performance.now() - t0;
  return { s };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ======================================================================
   Shaders
   ====================================================================== */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB;
uniform highp sampler2D uPuff;   // one puff per cell: (x, y, radius, hash); radius 0 = none
uniform vec2 uRes, uGrid, uPGrid;
uniform float uScale, uSeed, uStep, uMix, uTime, uPG, uBody, uReach;
uniform vec3 uTod;               // weights: day, dusk, night (sum 1)
uniform vec4 uSun;               // x, y, radius, visibility
uniform vec3 uSunCol;
uniform float uRays;             // cartoon sun rays (day only)
uniform vec4 uMoon;              // x, y, radius, visibility
uniform vec4 uBg[12];            // background clouds: x, y, half width, layer + fract(id); half width 0 = none
uniform vec4 uBal;               // balloon: x, y, scale, tilt; scale 0 = none
uniform vec4 uBird[6];           // x, y, wing flap (-1..1), size; size 0 = none
uniform vec4 uShoot;             // shooting star head: x, y, angle, brightness (0 = none)
uniform float uShootL;
out vec4 o;

// ---- palette: three moods, blended by uTod ----
const vec3 DAY_T = vec3(0.30, 0.58, 0.92), DAY_B = vec3(0.64, 0.84, 0.98);
const vec3 DUSK_T = vec3(0.33, 0.33, 0.62), DUSK_M = vec3(0.90, 0.52, 0.56), DUSK_B = vec3(1.00, 0.76, 0.48);
const vec3 NIGHT_T = vec3(0.03, 0.05, 0.16), NIGHT_B = vec3(0.10, 0.15, 0.33);

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
float fieldS(vec2 p) {
  vec2 uv = (p / uStep + 0.5) / uGrid;
  return mix(texture(uFA, uv).r, texture(uFB, uv).r, uMix);
}
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }
float ellD(vec2 p, vec2 r) { return (length(p / r) - 1.0) * min(r.x, r.y); }

// cloud mood colours: body, shade, outline, lit rim
vec3 moodMix(vec3 d, vec3 k, vec3 n) { return d * uTod.x + k * uTod.y + n * uTod.z; }
vec3 cBody() { return moodMix(vec3(0.87, 0.92, 0.99), vec3(0.97, 0.80, 0.78), vec3(0.40, 0.46, 0.64)); }
vec3 cShade() { return moodMix(vec3(0.72, 0.80, 0.93), vec3(0.82, 0.58, 0.66), vec3(0.25, 0.30, 0.48)); }
vec3 cLine() { return moodMix(vec3(0.44, 0.58, 0.82), vec3(0.62, 0.40, 0.52), vec3(0.13, 0.17, 0.33)); }
vec3 cRim() { return moodMix(vec3(1.00, 1.00, 1.00), vec3(1.00, 0.96, 0.84), vec3(0.70, 0.76, 0.92)); }

vec4 puffAt(ivec2 c) {
  if (c.x < 0 || c.y < 0 || float(c.x) >= uPGrid.x || float(c.y) >= uPGrid.y) return vec4(0.0);
  vec4 q = texelFetch(uPuff, c, 0);
  // slow breathing of each puff
  q.z *= 1.0 + 0.045 * sin(uTime * 0.55 + q.w * 40.0);
  return q;
}
// distance to the icon cloud (<0 inside)
float cloudD(vec2 q) {
  float s = fieldS(q);
  float d = s + uBody;
  if (s > uReach || s < -uPG * 2.4) return d;
  ivec2 c0 = ivec2(floor(q / uPG)) + 1;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec4 c = puffAt(c0 + ivec2(i, j));
    if (c.z <= 0.0) continue;
    d = smin(d, length(q - c.xy) - c.z, 3.0);
  }
  return d;
}

// ---- background clouds: a few circles with a flat bottom, in units of the half width ----
float bgShape(vec2 q, float h) {
  float d = length(q - vec2(-0.55, 0.06)) - (0.36 + 0.08 * h);
  d = smin(d, length(q - vec2(-0.08, -0.16 - 0.1 * h)) - (0.48 + 0.06 * fract(h * 7.0)), 0.06);
  d = smin(d, length(q - vec2(0.42, -0.02)) - (0.38 + 0.08 * fract(h * 13.0)), 0.06);
  d = smin(d, length(q - vec2(0.78, 0.14)) - 0.22, 0.06);
  d = smin(d, length(q - vec2(-0.86, 0.18)) - 0.18, 0.06);
  return max(d, q.y - 0.26);
}
vec3 drawBg(vec3 col, vec2 p, int layer) {
  for (int i = 0; i < 12; i++) {
    vec4 b = uBg[i];
    if (b.z <= 0.0 || int(b.w) != layer) continue;
    vec2 q = (p - b.xy) / b.z;
    if (abs(q.x) > 1.15 || q.y < -0.9 || q.y > 0.4) continue;
    float h = fract(b.w);
    float px = 1.0 / (b.z * uScale);
    float d = bgShape(q, h);
    if (d > 2.0 * px) continue;
    float db = bgShape(q + vec2(0.04, 0.12), h);           // bottom shade band
    vec3 cc = mix(cBody(), cShade(), ss(-px, px, db));
    cc = mix(cc, cLine(), ss(-0.025 - px, -0.025 + px, d) * 0.8);
    float haze = layer == 0 ? 0.55 : layer == 1 ? 0.3 : 0.1;  // farther clouds sink into the sky colour
    cc = mix(cc, col, haze);
    col = mix(col, cc, ss(px, -px, d));
  }
  return col;
}

// ---- hot-air balloon (local units: envelope radius 1) ----
vec3 drawBalloon(vec3 col, vec2 p) {
  if (uBal.z <= 0.0) return col;
  float R = 22.0 * uBal.z;
  vec2 q0 = p - uBal.xy;
  if (abs(q0.x) > R * 1.3 || q0.y < -R * 1.3 || q0.y > R * 2.3) return col;
  float ct = cos(uBal.w), st = sin(uBal.w);
  vec2 q = mat2(ct, -st, st, ct) * q0 / R;
  float px = 1.0 / (R * uScale);
  vec3 amb = moodMix(vec3(1.0), vec3(1.0, 0.86, 0.80), vec3(0.42, 0.48, 0.68));
  vec3 lineC = vec3(0.25, 0.16, 0.18) * amb;
  // ropes and basket
  float rope = min(segD(q, vec2(-0.36, 1.18), vec2(-0.2, 1.62)), segD(q, vec2(0.36, 1.18), vec2(0.2, 1.62)));
  col = mix(col, lineC, ss(0.045 + px, 0.045 - px, rope));
  vec2 bq = q - vec2(0.0, 1.74);
  float bd = max(abs(bq.x) - 0.22 + bq.y * 0.12, abs(bq.y) - 0.14);
  vec3 bc = mix(vec3(0.66, 0.42, 0.22), vec3(0.50, 0.30, 0.16), step(0.0, bq.y)) * amb;
  bc = mix(bc, lineC, ss(-0.05 - px, -0.05 + px, bd));
  col = mix(col, bc, ss(px, -px, bd));
  // envelope: round top tapering to a narrow mouth
  float y = q.y;
  float w = y < 0.0 ? sqrt(max(1.0 - y * y, 0.0)) : mix(1.0, 0.32, ss(0.0, 1.18, y) * 0.6 + 0.4 * (y / 1.18));
  float d = y < 0.0 ? length(q) - 1.0 : max(abs(q.x) - w, y - 1.18);
  if (d < 2.0 * px) {
    float u = clamp(q.x / max(w, 0.05), -1.0, 1.0);
    float g = asin(u) / 1.5708;                            // -1..1 around the envelope
    float gore = floor((g + 1.0) * 3.5);
    vec3 c1 = vec3(0.95, 0.33, 0.30), c2 = vec3(1.0, 0.86, 0.36), c3 = vec3(0.98, 0.97, 0.92);
    float k = mod(gore, 3.0);
    vec3 ec = k < 0.5 ? c1 : k < 1.5 ? c2 : c3;
    ec = mix(ec, ec * vec3(0.72, 0.70, 0.82), ss(-0.1, 0.9, u));    // shaded right side
    ec = mix(ec, mix(ec, vec3(1.0), 0.45), ss(-0.6, -0.95, u) * ss(0.2, -0.6, y));   // lit upper left
    // a band around the waist and the mouth
    ec = mix(ec, vec3(0.30, 0.55, 0.85), ss(0.05, 0.03, abs(y - 0.55)) );
    ec *= amb;
    float edge = abs(fract((g + 1.0) * 3.5) - 0.5);
    ec = mix(ec, lineC, ss(0.47, 0.5, edge) * 0.35 * step(-0.9, y));
    ec = mix(ec, lineC, ss(-0.05 - px, -0.05 + px, d));
    col = mix(col, ec, ss(px, -px, d));
  }
  return col;
}

// ---- birds seen from the side (a little "m") ----
float birdD(vec2 p, vec4 b) {
  vec2 q = (p - b.xy) / b.w;
  q.x = abs(q.x);
  float f = b.z;
  vec2 el = vec2(3.6, -1.6 - 2.2 * f), tip = vec2(7.5, 0.6 - 3.6 * f);
  float d = min(segD(q, vec2(0.0, 0.4), el), segD(q, el, tip));
  return (d - 0.75 + 0.35 * ss(2.0, 7.5, q.x)) * b.w;
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  float v = p.y / uRes.y;

  // ---------- sky ----------
  vec4 n1 = N(p, 1600.0);
  float vv = clamp(v + (n1.b - 0.5) * 0.06, 0.0, 1.0);
  vec3 day = mix(DAY_T, DAY_B, ss(-0.1, 1.05, vv));
  vec3 dusk = vv < 0.55 ? mix(DUSK_T, DUSK_M, ss(-0.05, 0.55, vv)) : mix(DUSK_M, DUSK_B, ss(0.55, 1.0, vv));
  vec3 night = mix(NIGHT_T, NIGHT_B, ss(0.0, 1.1, vv));
  vec3 col = day * uTod.x + dusk * uTod.y + night * uTod.z;
  // soft cartoon light bands (barely visible, flat style)
  col *= 1.0 + 0.02 * (uTod.x + uTod.y) * step(0.5, fract(vv * 3.5 + n1.r * 0.5));

  // ---------- stars ----------
  if (uTod.z > 0.01) {
    const float SG = 38.0;
    vec2 sc = floor(p / SG);
    float h = hash2(sc + 5.3);
    if (h < 0.42) {
      vec2 sp = (sc + 0.2 + 0.6 * vec2(hash2(sc + 1.7), hash2(sc + 8.1))) * SG;
      vec2 d = abs(p - sp);
      float big = step(h, 0.06);
      float tw = 0.72 + 0.28 * sin(uTime * (0.35 + 0.7 * hash2(sc + 3.3)) + h * 60.0);   // slow, gentle twinkle
      float r = 0.8 + 1.0 * hash2(sc + 9.9);
      float m = ss(r + 0.6, r - 0.4, length(p - sp));
      // the biggest stars are little four-point sparkles
      float spark = big * ss(1.2, 0.0, min(d.x, d.y)) * ss(5.5 * tw + 1.5, 0.0, max(d.x, d.y));
      vec3 stc = mix(vec3(1.0, 0.95, 0.80), vec3(0.85, 0.92, 1.0), hash2(sc + 2.2));
      col = mix(col, stc, clamp(max(m, spark), 0.0, 1.0) * tw * uTod.z * (1.0 - 0.6 * ss(0.7, 1.0, v)));
    }
    // shooting star
    if (uShoot.w > 0.0) {
      vec2 dir = vec2(cos(uShoot.z), sin(uShoot.z));
      vec2 rel = p - uShoot.xy;
      float along = -dot(rel, dir);
      if (along > -4.0 && along < uShootL + 4.0) {
        float across = abs(dot(rel, vec2(-dir.y, dir.x)));
        float t = clamp(along / uShootL, 0.0, 1.0);
        float w = mix(1.6, 0.2, t);
        float m = ss(w + 0.7, w - 0.3, across) * (1.0 - t) * step(-1.0, along);
        m = max(m, ss(2.6, 1.0, length(rel)));
        col = mix(col, vec3(1.0, 0.98, 0.88), m * uShoot.w * uTod.z);
      }
    }
  }

  // ---------- sun (day / dusk) and moon (night) ----------
  if (uSun.w > 0.0) {
    vec2 q = p - uSun.xy;
    float r = length(q);
    float R = uSun.z;
    col = mix(col, uSunCol, ss(R * 4.0, R, r) * 0.28 * uSun.w);          // glow
    if (uRays > 0.0) {
      float a = atan(q.y, q.x) + uTime * 0.03;
      float ray = abs(fract(a * 12.0 / 6.2832) - 0.5) * 2.0;           // 12 rounded wedges
      float rr = mix(R * 1.25, R * 1.62, ray);
      float m = ss(1.0, -1.0, r - rr) * ss(R * 1.12, R * 1.2, r);

    if (k === 'tod') { x = Math.round(x); todCheck = -1e9; }
    P[k] = x;
    if (k === 'sigma') field = true;
  }
  if (field && FB) commit();                      // cloud size: smooth transition too
}
function drawGhosts() {
  const box = document.getElementById('ghosts');
  if (box) box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  refresh();                                     // empty sky until we know where the icons are
  let first = true;
  const handle = m => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical -> CSS pixels
    icons = m.vis && Array.isArray(m.r) ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: clouds grow in; later: smooth transition
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) { try { handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); } catch (e) {} } });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => { try { handle(JSON.parse(ev.data)); } catch (e) { console.error(e); } });
  host.postMessage('ready');
}
function startDemo() {
  // plain browser: a column of icons on the right and a few scattered ones
  const list = [];
  for (let r = 0; r < 6; r++) list.push({ x: W - 90, y: 10 + r * 100, w: 76, h: 92 });
  list.push({ x: W * 0.22, y: H * 0.3, w: 76, h: 92 }, { x: W * 0.45, y: H * 0.62, w: 76, h: 92 }, { x: W * 0.52, y: H * 0.18, w: 76, h: 92 });
  icons = list;
  commit(true);
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); refresh(); }, 100);
});

window.__dbg = { P, stats: () => ({ fieldMs, frameMs, fps: fpsEMA, tod }) };
resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else startDemo();
requestAnimationFrame(frame);
</script>
