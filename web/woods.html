<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconland · Woods</title>
<!--
  Iconland · Woods theme (top-down storybook forest, gouache / cartoon style; pure WebGL2, one full-screen pass)
  - Clearing field (CPU, only when icons change): gaussian metaballs + noise warp -> signed distance s (<0 = clearing).
    The same field texture also carries the distance to winding dirt paths that link neighbouring clearings.
  - Trees: round layered crowns on a jittered grid, sized by the field (smaller near the clearing edge, gone inside it),
    each with a soft drop shadow; swayed by wind on the CPU, binned into a small cell texture the shader looks up.
  - Life: a flock of birds crossing over the canopy now and then, butterflies over the clearings, a fox that rarely
    trots across a clearing, and a deer, a hare and a hedgehog strolling along the dirt paths between clearings
    (all drawn as tiny SDFs from a handful of uniforms).
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2c4a2a; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* preview mode (?preview=1, settings window): translucent boxes show where the real icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.55); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="nogl">WebGL2 is not available.</div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 0;
const STEP = 5;
const MORPH_MS = 1800;
const WARP = 40;                         // how much the clearing outline is bent by noise (px)

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');        // real desktop: messages from the host
const PREVIEW = QS.has('preview');       // settings window preview (iframe): messages from the parent page
// Defaults must match themes.json
const P = {
  sigma: 70, density: 1, wind: 1, autumn: 0.12, life: 1,
  quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const KEYS = { sigma: [40, 200], density: [0.5, 1.6], wind: [0, 3], autumn: [0, 1], life: [0, 1] };

/* ======================================================================
   Random / noise helpers (CPU)
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
// Tileable noise texture (fixed, does not depend on the seed): 4 channels of fbm at different scales
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const h = (a, b) => { let v = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(k, 2246822519); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  const a = h(x0, y0), b = h(x1, y0), c = h(x0, y1), d = h(x1, y1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [4, 8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let s = 0, w = 0.5, tw = 0;
      for (let j = 0; j < chans[c].length; j++) { const p = chans[c][j]; s += w * tileNoise(u * p, v * p, p, p, 100 + c * 50 + j * 13); tw += w; w *= 0.5; }
      d[i + c] = Math.min(Math.max((s / tw - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

/* ======================================================================
   Clearing field (CPU): s = signed distance to the forest edge (<0 clearing), pd = distance to a dirt path
   ====================================================================== */
const PATH_MAX = 60;
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}
let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = WARP * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    // clamped deep in the forest so old and new clearings cross-fade evenly during a transition
    s[i] = Math.min(90, sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0));
  }
  const pd = computePaths(rects, s);
  fieldMs = performance.now() - t0;
  return { s, pd };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}
// Dirt paths: icons whose clearings are separate get linked by a minimum spanning tree of short winding paths
let lastLinks = [];        // polylines of the paths just computed (the animals walk along them)
function computePaths(rects, s) {
  lastLinks = [];
  const pd = new Float32Array(Gw * Gh).fill(PATH_MAX);
  const n = rects.length;
  if (n < 2) return pd;
  const sAt = (x, y) => sampleArr(s, x, y);
  // group icons that share a clearing (the straight line between them stays inside the clearing)
  const par = rects.map((_, i) => i), find = i => par[i] === i ? i : (par[i] = find(par[i]));
  const edges = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = rects[i], b = rects[j], d = Math.hypot(a.cx - b.cx, a.cy - b.cy);
    if (d > 700) continue;
    let open = true;
    for (let k = 1; k < 8 && open; k++) { const t = k / 8; if (sAt(a.cx + (b.cx - a.cx) * t, a.cy + (b.cy - a.cy) * t) > -4) open = false; }
    if (open) par[find(i)] = find(j);
    else edges.push([d, i, j]);
  }
  edges.sort((a, b) => a[0] - b[0]);
  const links = [];
  for (const [d, i, j] of edges) {
    const ri = find(i), rj = find(j);
    if (ri === rj) continue;
    par[ri] = rj; links.push([rects[i], rects[j], d, i, j]);
  }
  lastLinks = [];
  // stamp each winding path into the grid (distance to the nearest sample point, within PATH_MAX)
  const RP = PATH_MAX, RG = Math.ceil(RP / STEP);
  for (const [a, b, d, ia, ib] of links) {
    const pts = [];
    const nx = -(b.cy - a.cy) / d, ny = (b.cx - a.cx) / d;
    const k1 = hash2(Math.round(a.cx), Math.round(b.cy), 31), k2 = hash2(Math.round(b.cx), Math.round(a.cy), 37);
    const amp = Math.min(55, d * 0.12) * (k1 < 0.5 ? -1 : 1), waves = 1 + Math.floor(k2 * 2), ph = k2 * 6.283;
    const cnt = Math.ceil(d / 5);
    for (let k = 0; k <= cnt; k++) {
      const t = k / cnt, env = Math.sin(t * Math.PI);
      const o = amp * env * Math.sin(t * Math.PI * waves + ph * 0.3) + 10 * env * Math.sin(t * 17 + ph);
      const px = a.cx + (b.cx - a.cx) * t + nx * o, py = a.cy + (b.cy - a.cy) * t + ny * o;
      pts.push(px, py);
      const gx = Math.round(px / STEP), gy = Math.round(py / STEP);
      for (let yy = Math.max(0, gy - RG); yy <= Math.min(Gh - 1, gy + RG); yy++)
        for (let xx = Math.max(0, gx - RG); xx <= Math.min(Gw - 1, gx + RG); xx++) {
          const i = yy * Gw + xx, dd = Math.hypot(xx * STEP - px, yy * STEP - py);
          if (dd < pd[i]) pd[i] = dd;
        }
    }
    lastLinks.push({ a: ia, b: ib, ra: a, rb: b, pts });
  }
  return pd;
}

/* ======================================================================
   Shaders
   ====================================================================== */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB;
uniform highp sampler2D uTree;   // tree crowns binned per cell: TK per cell, (x, y, radius, palette + height)
uniform vec2 uRes, uGrid, uTGrid;
uniform float uScale, uSeed, uStep, uMix, uTime, uCellG, uWind;
uniform vec4 uBird[6];           // x, y, heading, wing flap (-1..1); radius 0 = none
uniform float uBirdN;
uniform vec4 uFly[3];            // butterflies: x, y, flap phase, colour (0 = none, 1..3)
uniform vec4 uFox;               // x, y, heading, gait phase
uniform float uFoxOn;
uniform vec4 uWk[3];             // path walkers: x, y, heading, gait phase
uniform vec4 uWk2[3];            // species (0 none, 1 deer, 2 hare, 3 hedgehog), alpha, head down, alert
out vec4 o;

const int TK = 24;
const vec3 FLOOR = vec3(0.13, 0.22, 0.14), FLOOR2 = vec3(0.20, 0.27, 0.13);  // forest floor between crowns
const vec3 G_SUN = vec3(0.60, 0.74, 0.33), G_MID = vec3(0.48, 0.65, 0.29), G_DEEP = vec3(0.39, 0.57, 0.27);  // clearing grass
const vec3 DIRT = vec3(0.66, 0.50, 0.32), DIRT_D = vec3(0.50, 0.36, 0.22);
const vec3 SHADE = vec3(0.50, 0.55, 0.70);       // multiply colour for cast shadows (cool)
const vec2 LIGHT = vec2(-0.6, -0.8);             // sun from the upper left
const vec2 SHDIR = vec2(0.58, 0.81);             // shadows fall to the lower right

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
vec2 field(vec2 p) {
  vec2 uv = (p / uStep + 0.5) / uGrid;
  return mix(texture(uFA, uv).rg, texture(uFB, uv).rg, uMix);
}
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }
float ellD(vec2 p, vec2 r) { return (length(p / r) - 1.0) * min(r.x, r.y); }   // rough ellipse distance (fine for tiny shapes)
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }

vec3 pal(int i) {
  if (i == 0) return vec3(0.30, 0.53, 0.25);    // leafy green
  if (i == 1) return vec3(0.21, 0.44, 0.24);    // deep green
  if (i == 2) return vec3(0.47, 0.60, 0.23);    // yellow-green
  if (i == 3) return vec3(0.15, 0.36, 0.31);    // pine (blue-green)
  if (i == 4) return vec3(0.88, 0.55, 0.17);    // autumn orange
  if (i == 5) return vec3(0.92, 0.74, 0.24);    // autumn gold
  return vec3(0.76, 0.30, 0.18);                // autumn red
}
// crown outline radius factor at angle a (leafy scallops or spiky pine)
float edgeF(int idx, float a, float h) {
  float rust = uWind * 0.03 * sin(uTime * 0.6 + h * 37.0);
  if (idx == 3) { float t = fract((a + rust) * 11.0 / 6.2832 + h * 3.0); return 1.0 + 0.11 * (abs(t - 0.5) * 2.0 - 0.5); }
  float n = 6.0 + floor(h * 4.0);
  return 1.0 + 0.045 * sin(a * n + h * 40.0 + rust) + 0.025 * sin(a * (n * 2.0 + 1.0) + h * 13.0);
}
// signed distance (px) to a crown outline
float crownD(vec4 c, vec2 p) {
  vec2 d = p - c.xy;
  int idx = int(c.w); float h = fract(c.w);
  return length(d) - c.z * edgeF(idx, atan(d.y, d.x), h);
}
// gouache crown: dark shade side, base layer, light layer toward the sun, a highlight dab, brushy texture
vec3 crownCol(vec4 c, vec2 p, float shade) {
  int idx = int(c.w); float h = fract(c.w);
  vec3 base = pal(idx);
  base *= 0.92 + 0.16 * fract(h * 7.31 + 0.13);                 // every tree its own tint (stable: from the tree id, not its swaying position)
  vec3 dark = base * vec3(0.52, 0.58, 0.70);
  vec3 lite = mix(base, vec3(1.0, 0.96, 0.62), 0.24);
  vec3 hi = mix(base, vec3(1.0, 0.97, 0.70), 0.42);
  vec2 q = (p - c.xy) / c.z;
  float a = atan(q.y, q.x), r = c.z;
  float aa = 1.2 / (r * uScale);
  vec3 col = dark;
  if (idx == 3) {
    // pine: stacked stars of needles, lighter toward the sunny top
    float t1 = abs(fract(a * 9.0 / 6.2832 + h * 5.0) - 0.5) * 2.0;
    float t2 = abs(fract(a * 7.0 / 6.2832 + h * 2.0 + 0.25) - 0.5) * 2.0;
    float t3 = abs(fract(a * 5.0 / 6.2832 + h * 7.0) - 0.5) * 2.0;
    col = mix(col, base, ss(aa, -aa, length(q - LIGHT * 0.10) - 0.82 + 0.20 * t1));
    col = mix(col, lite, ss(aa, -aa, length(q - LIGHT * 0.20) - 0.56 + 0.18 * t2));
    col = mix(col, hi, ss(aa, -aa, length(q - LIGHT * 0.26) - 0.28 + 0.12 * t3) * 0.8);
  } else {
    float e1 = 0.05 * sin(a * 7.0 + h * 29.0) + 0.02 * sin(a * 13.0 + h * 7.0);
    float e2 = 0.07 * sin(a * 4.0 + h * 17.0) + 0.03 * sin(a * 9.0 + h * 5.0);
    col = mix(col, base, ss(aa, -aa, length(q - LIGHT * 0.14) - 0.80 - e1));
    col = mix(col, lite, ss(aa, -aa, length(q - LIGHT * 0.33) - 0.50 - e2));
    // a small sunlit dab of leaves
    vec2 hq = q - LIGHT * 0.48;
    float ha = atan(hq.y, hq.x);
    col = mix(col, hi, ss(aa, -aa, length(hq) - 0.15 - 0.035 * sin(ha * 3.0 + h * 9.0)) * 0.6);
    // two or three dark leaf-clump notches on the shade side
    for (int i = 0; i < 3; i++) {
      float ang = 0.3 + float(i) * 0.9 + h * 2.0;
      vec2 cc = vec2(cos(ang), sin(ang)) * 0.55;
      float dd = abs(length(q - cc) - 0.26);
      col = mix(col, col * 0.84, (1.0 - ss(0.0, 0.035, dd)) * ss(0.0, 0.3, dot(q, -LIGHT)) * step(length(q), 0.78));
    }
  }
  // brush texture and paper grain
  vec4 nz = N(p - c.xy + h * 977.0, 70.0);                   // texture follows the crown, so it doesn't crawl as the tree sways
  col *= 0.90 + 0.20 * nz.r;
  col = mix(col, col * 0.85, ss(0.55, 0.8, nz.a) * 0.5);
  return mix(col, col * SHADE, shade);
}

float grassInk(vec2 p) {
  const vec2 G = vec2(9.0, 6.0);
  vec2 c0 = floor(p / G);
  float ink = 0.0;
  for (int j = -1; j <= 1; j++) {
    vec2 c = c0 + vec2(0.0, float(j));
    vec2 cp = (c + 0.5) * G;
    float h = hash2(c + 3.1);
    float dens = 0.6 * ss(0.38, 0.7, N(cp, 700.0).r) + 0.06;
    if (h > dens) continue;
    float ang = -1.25 + (N(cp, 1100.0).g - 0.5) * 0.6 + (hash2(c + 7.7) - 0.5) * 0.5;   // mostly upright blades
    float len = 1.8 + 2.2 * hash2(c + 1.9);
    vec2 ctr = cp + (vec2(hash2(c + 4.3), hash2(c + 5.9)) - 0.5) * vec2(5.0, 3.0);
    vec2 dir = vec2(cos(ang), sin(ang)) * len;
    float d = segD(p, ctr - dir, ctr + dir);
    ink = max(ink, (1.0 - ss(0.25, 0.9, d)) * (0.35 + 0.45 * hash2(c + 9.1)));
  }
  return ink;
}
// small flowers dotted over the grass
vec4 flower(vec2 p) {
  const float G = 15.0;
  vec2 c = floor(p / G);
  float h = hash2(c + 11.3);
  float dens = 0.04 + 0.22 * ss(0.4, 0.75, N(c * G, 500.0).b);
  if (h > dens) return vec4(0.0);
  vec2 ctr = (c + 0.2 + 0.6 * vec2(hash2(c + 2.2), hash2(c + 6.1))) * G;
  vec2 q = p - ctr;
  float k = hash2(c + 8.8);
  vec3 pc = k < 0.45 ? vec3(0.98, 0.97, 0.92) : k < 0.75 ? vec3(0.99, 0.84, 0.25) : k < 0.9 ? vec3(0.95, 0.58, 0.70) : vec3(0.62, 0.66, 0.96);
  float a = atan(q.y, q.x), r = length(q);
  float pet = 2.1 + 0.9 * cos(a * 5.0 + k * 30.0);
  float m = ss(0.6, -0.4, r - pet);
  vec3 col = mix(pc, vec3(0.98, 0.72, 0.18), ss(1.1, 0.6, r));
  return vec4(col, m);
}

// birds over the canopy (V shapes, flapping)
float birdD(vec2 p, vec4 b) {
  vec2 q = rot(-b.z) * (p - b.xy);            // forward = +x
  q.y = abs(q.y);
  float f = b.w;                              // -1..1 flap
  vec2 el = vec2(-2.0, 5.0 + 1.5 * f), tip = vec2(-5.5 - 1.5 * f, 10.0 + 1.0 * f);
  float d = min(segD(q, vec2(1.5, 0.0), el), segD(q, el, tip));
  d = min(d, ellD(q - vec2(0.5, 0.0), vec2(4.0, 1.4)));
  return d - 0.9 + 0.5 * ss(4.0, 10.0, q.y);
}
// fox seen from above (forward = +x)
vec4 foxCol(vec2 p) {
  vec2 q = rot(-uFox.z) * (p - uFox.xy) / 1.3;   // drawn 1.3x larger than the units below
  float g = uFox.w;
  vec3 col = vec3(0.0); float a = 0.0;
  vec3 OR = vec3(0.86, 0.44, 0.13), DK = vec3(0.22, 0.12, 0.08), WH = vec3(0.98, 0.95, 0.88);
  // legs: four dark dots stepping
  for (int i = 0; i < 4; i++) {

   ====================================================================== */

    const a = Math.random() * 6.283, d = Math.random() * P.sigma * 1.1 + 30;

  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
  trees = null;
}

const T0 = performance.now();
let lastT = 0, fpsEMA = 0, frameN = 0, frameMs = 0, lifeT = 0;
let paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 31) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  if (lastT) fpsEMA = fpsEMA ? fpsEMA * 0.9 + (1 / dt) * 0.1 : 1 / dt;
  lastT = now;
  lifeT += dt;
  stepLife(lifeT, dt);
  draw(now);
  frameN++;
}
function draw(now) {
  const t0 = performance.now();
  const e = Math.min(Math.max((now - morphT0) / morphDur, 0), 1);
  curMix = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  const t = (now - T0) / 1000;
  uploadTrees(t);
  const { p, U } = PR;
  gl.useProgram(p);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ftex[fromI]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ftex[toI]);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, treeTex);
  gl.uniform1i(U.uNoise, 0); gl.uniform1i(U.uFA, 1); gl.uniform1i(U.uFB, 2); gl.uniform1i(U.uTree, 3);
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform2f(U.uTGrid, tgW, tgH);
  gl.uniform1f(U.uCellG, CELL_G);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (seed % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uTime, t % 3600);
  gl.uniform1f(U.uWind, P.wind);
  gl.uniform4fv(U.uBird, birdU); gl.uniform1f(U.uBirdN, birdN);
  gl.uniform4fv(U.uFly, flyU);
  gl.uniform4fv(U.uFox, foxU); gl.uniform1f(U.uFoxOn, foxOn);
  gl.uniform4fv(U.uWk, walkU); gl.uniform4fv(U.uWk2, walkK);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frameMs = performance.now() - t0;
}

/* ======================================================================
   Settings / hosted mode
   ====================================================================== */
let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise(); trees = null;
  if (!iconsSeen) return;
  commit(true);
}
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, rebuild = false;
  for (const k in v) {
    if (!KEYS[k] || typeof v[k] !== 'number' || !isFinite(v[k]) || P[k] === v[k]) continue;
    const [lo, hi] = KEYS[k];
    let x = Math.min(Math.max(v[k], lo), hi);
    if (k === 'life') { if (x !== 0 && x !== 1) continue; }
    P[k] = x;
    if (k === 'sigma') field = true;
    if (k === 'density' || k === 'autumn') rebuild = true;
  }
  if (rebuild) trees = null;
  if (field && FB) commit();                      // clearing size: smooth transition too
}
function drawGhosts() {
  const box = document.getElementById('ghosts');
  if (box) box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  refresh();                                     // full forest until we know where the icons are
  let first = true;
  const handle = m => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical -> CSS pixels
    icons = m.vis && Array.isArray(m.r) ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: clearings open up; later: smooth transition
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) { try { handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); } catch (e) {} } });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => { try { handle(JSON.parse(ev.data)); } catch (e) { console.error(e); } });
  host.postMessage('ready');
}
function startDemo() {
  // plain browser: a column of icons on the right and a few scattered ones
  const list = [];
  for (let r = 0; r < 6; r++) list.push({ x: W - 90, y: 10 + r * 100, w: 76, h: 92 });
  list.push({ x: W * 0.22, y: H * 0.3, w: 76, h: 92 }, { x: W * 0.45, y: H * 0.62, w: 76, h: 92 }, { x: W * 0.52, y: H * 0.18, w: 76, h: 92 });
  icons = list;
  commit(true);
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); refresh(); }, 100);
});

window.__dbg = { P, stats: () => ({ fieldMs, frameMs, treeStats, fps: fpsEMA }) };
resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else startDemo();
requestAnimationFrame(frame);
</script>
<script src="share.js"></script>
<script src="sound.js"></script>
</body>
