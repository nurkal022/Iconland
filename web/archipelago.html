<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconland · Archipelago</title>
<!--
  Iconland · Archipelago theme (a deep tropical ocean seen from straight above; pure WebGL2, one full-screen pass)
  - Islands: a CPU field (gaussian metaballs around the icons + noise warp) gives the signed distance to the coast
    (<0 on land). Each icon or cluster of nearby icons becomes an island: a white surf ring, a sandy rim and a lush
    green interior with soft hills and a canopy of round tree crowns. Turquoise lagoon shallows with reef patches
    fall off into deep blue open water with calm painted wave strokes.
  - Ships: a few small sailing ships travel from island to island. Routes are found with A* on a coarse grid of
    water cells with clearance from the coast, string-pulled and smoothed (Chaikin), and followed at a calm speed
    with rate-limited turning. Ships dock for a few seconds off a harbour point, furl their sails, then pick a new
    destination. When the icons move, routes are re-planned; ships caught by new land slide off it (or fade out
    and back in at a harbour). Each ship leaves a fading white wake (its recent stern positions in a small
    texture) and casts a small shadow on the water.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3557; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(20,40,30,.3); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="nogl">WebGL2 is not available.</div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 0;
const STEP = 5;
const MORPH_MS = 1800;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');
const PREVIEW = QS.has('preview');
const LIFETEST = QS.has('lifetest');     // debug: ships start mid-route right away, state printed into __snapErrors
// Defaults must match themes.json
const P = {
  sigma: 62, warp: 40, ships: 4, speed: 1, waves: 1,
  quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const KEYS = { sigma: [30, 140], warp: [0, 80], ships: [0, 8], speed: [0.3, 3], waves: [0, 2] };

/* ======================================================================
   Random / noise helpers (CPU)
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
// Tileable noise texture (fixed): 4 channels of fbm at different scales
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const h = (a, b) => { let v = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(k, 2246822519); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  const a = h(x0, y0), b = h(x1, y0), c = h(x0, y1), d = h(x1, y1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [4, 8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let s = 0, w = 0.5, tw = 0;
      for (let j = 0; j < chans[c].length; j++) { const p = chans[c][j]; s += w * tileNoise(u * p, v * p, p, p, 300 + c * 50 + j * 13); tw += w; w *= 0.5; }
      d[i + c] = Math.min(Math.max((s / tw - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

/* ======================================================================
   Island field (CPU): s = signed distance to the coast (<0 on land)
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0032, y * 0.0032, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0032, y * 0.0032, 2) - 0.47;
  }
}
let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  // floor = the contribution at the edge of the evaluated window, so open water has no square seams
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = Math.min(400, sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0));
  }
  fieldMs = performance.now() - t0;
  return { s };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ======================================================================
   Shaders
   ====================================================================== */
const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const MAXSHIP = 8, WAKE_K = 40, MAXFX = 6, MAXDEB = 28;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB;
uniform highp sampler2D uWake;   // one row per ship: (x, y, age s, ship alpha), newest first; age < 0 = end
uniform vec2 uRes, uGrid;
uniform float uScale, uSeed, uStep, uMix, uTime, uWaves, uSigma;
uniform int uShipN;
uniform vec4 uShip[${MAXSHIP}];       // x, y, heading, alpha
uniform vec4 uShipB[${MAXSHIP}];      // scale, sail (0 furled .. 1 set), boom side -1..1, style index
uniform vec4 uWakeBox[${MAXSHIP}];    // bounding box of the wake (x0, y0, x1, y1)
uniform vec4 uShipC[${MAXSHIP}];      // sinking 0..1 (darker), squish (heeling: narrower), bob phase, -
uniform int uFxN, uDebN;
uniform vec4 uFx[${MAXFX}];           // x, y, kind (0 whirlpool, 1 splash), strength (whirlpool) / phase 0..1 (splash)
uniform vec4 uFxB[${MAXFX}];          // whirlpool: radius, turn direction, turned angle; splash: scale, -, seed
uniform vec4 uDeb[${MAXDEB}];         // wreck debris: x, y, rotation, alpha
uniform vec4 uDebB[${MAXDEB}];        // type (0 bow half, 1 stern half, 2 plank, 3 sail scrap, 4 spar), scale, style, sinking
out vec4 o;

const int WAKE_K = ${WAKE_K};
// water: surf-side shallows -> lagoon -> reef blue -> ocean -> abyss
const vec3 SHOAL = vec3(0.60, 0.90, 0.80), LAGOON = vec3(0.16, 0.73, 0.75), REEFB = vec3(0.05, 0.50, 0.66);
const vec3 OCEAN = vec3(0.04, 0.30, 0.52), ABYSS = vec3(0.025, 0.15, 0.34);
const vec3 FOAM = vec3(0.96, 0.98, 0.98), CREST = vec3(0.40, 0.64, 0.82);
const vec3 SAND_WET = vec3(0.82, 0.74, 0.56), SAND = vec3(0.95, 0.88, 0.69), SAND_HI = vec3(0.99, 0.95, 0.82);
const vec3 GRASS = vec3(0.47, 0.62, 0.27), JUNGLE = vec3(0.16, 0.42, 0.20), JUNGLE_D = vec3(0.07, 0.25, 0.13), JUNGLE_HI = vec3(0.42, 0.62, 0.26);
const vec2 LIGHT = vec2(-0.6, -0.8);                        // sun in the upper left
const vec2 SHOFF = vec2(2.2, 3.0);                          // ship shadow offset on the water
const float SWELL = -0.42;

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
float fieldS(sampler2D t, vec2 p) { return texture(t, (p / uStep + 0.5) / uGrid).r; }
float sAt(vec2 p) { return mix(fieldS(uFA, p), fieldS(uFB, p), uMix); }
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }

// short painted crest strokes on open water: at most one per cell of a swell-aligned grid, each with its own slow clock
vec2 waveInk(vec2 p, float t) {
  vec2 q = rot(SWELL) * p;
  q.y += t * 2.0;
  const vec2 G = vec2(52.0, 11.0);
  float ink = 0.0, foam = 0.0;
  for (int j = -1; j <= 1; j++) {
    float row = floor(q.y / G.y) + float(j);
    vec2 c = vec2(floor((q.x - row * 19.0) / G.x), row);
    vec2 cp = (c + 0.5) * G + vec2(row * 19.0, 0.0);
    float h = hash2(c + 5.1);
    float dens = (0.05 + 0.38 * ss(0.35, 0.8, N(cp, 700.0).r)) * min(uWaves, 1.5);
    if (h > dens) continue;
    float life = sin(fract(t * (0.04 + 0.045 * hash2(c + 7.7)) + hash2(c + 1.3)) * 3.14159);
    life *= life;
    float len = 8.0 + 12.0 * hash2(c + 1.9);
    vec2 ctr = cp + (vec2(hash2(c + 4.3), hash2(c + 5.9)) - 0.5) * vec2(10.0, 4.0);
    vec2 d = q - ctr;
    d.y -= (0.10 + 0.12 * hash2(c + 6.6)) * d.x * d.x / len;
    float k = clamp(d.x / len, -1.0, 1.0);
    float th = (0.15 + 0.7 * (1.0 - k * k)) * (0.7 + 0.5 * hash2(c + 9.1));
    float a = (1.0 - ss(th * 0.4, th + 0.75, segD(d, vec2(-len, 0.0), vec2(len, 0.0)))) * life;
    ink = max(ink, a * (0.3 + 0.35 * hash2(c + 2.7)));
    if (hash2(c + 12.7) < 0.03 + 0.18 * ss(0.62, 0.88, N(cp + 90.0, 380.0).g) * min(uWaves, 1.5)) foam = max(foam, a * 0.75);
  }
  return vec2(ink, foam);
}

// tree crowns on a jittered grid: returns (shade 0..1 inside a crown / -1 in a gap, crown tone id)
vec2 canopy(vec2 p, float G) {
  vec2 c0 = floor(p / G);
  float best = 1e9, tone = 0.0, lit = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = c0 + vec2(float(i), float(j));
    vec2 ctr = (c + 0.5 + (vec2(hash2(c + 3.7), hash2(c + 9.2)) - 0.5) * 0.7) * G;
    float r = G * (0.55 + 0.35 * hash2(c + 1.1));
    vec2 d = (p - ctr) / r;
    float dd = dot(d, d);
    // crowns lower on the screen sit "on top" (painter's order), so prefer them when overlapping
    float key = -ctr.y - hash2(c + 8.8) * 2.0;
    if (dd < 1.0 && key < best) { best = key; tone = hash2(c + 5.5); lit = clamp(0.6 + dot(d, LIGHT) * 0.5 - dd * 0.3, 0.0, 1.0) * (1.0 - 0.45 * ss(0.6, 1.0, dd)); }
  }
  return best > 1e8 ? vec2(-1.0, 0.0) : vec2(lit, tone);
}

// ---------- a small sailing ship, seen from straight above (forward = +x, units: px at scale 1) ----------
float hullD(vec2 q) {
  float x = q.x;
  float w = x > 0.0 ? 4.2 * (1.0 - pow(clamp(x / 11.5, 0.0, 1.0), 1.7)) : 4.2 * sqrt(max(0.0, 1.0 - pow(clamp(-x / 9.5, 0.0, 1.0), 4.0)));
  return max(abs(q.y) - w, max(x - 11.5, -9.5 - x)) * 0.85;
}
// a fore-and-aft sail seen from above: from the mast at m its boom runs aft, swung out by ang (to leeward);
// the cloth bellies out beyond the boom. Returns (distance, across 0..1 from boom to belly)
vec2 sailD(vec2 q, vec2 m, float ang, float Lb, float belly) {
  vec2 r = rot(-ang) * (q - m);            // boom along -x
  float u = -r.x / Lb;                     // 0 at the mast .. 1 at the boom end
  float side = ang >= 0.0 ? 1.0 : -1.0;
  float v = r.y * side;                    // >0 on the belly side
  float uc = clamp(u, 0.0, 1.0);
  float prof = belly * 4.0 * uc * pow(1.0 - uc, 0.75) + 0.45;
  float d = max(abs(v - prof * 0.5 + 0.2) - prof * 0.5, max(-r.x - Lb, r.x));
  return vec2(d, clamp(v / max(prof, 0.5), 0.0, 1.0));
}
// colour + coverage of a ship; q in ship space (already divided by scale); aa = one screen pixel in ship units
// sail: 0 furled .. 1 set; boom: -1..1 which side the booms swing to; style 0..3
vec4 shipCol(vec2 q, float sail, float boom, float style, float t, float aa) {
  float dh = hullD(q);
  float m = ss(aa, -aa, dh);
  vec3 wood = style < 1.0 ? vec3(0.42, 0.25, 0.13) : style < 2.0 ? vec3(0.62, 0.17, 0.12) : style < 3.0 ? vec3(0.13, 0.22, 0.36) : vec3(0.90, 0.88, 0.80);
  vec3 col = wood * 0.8;
  vec3 deck = vec3(0.80, 0.62, 0.40);
  float inDeck = ss(aa, -aa, dh + 1.0);
  col = mix(col, deck * (0.92 + 0.08 * step(0.5, fract(q.y * 0.55 + 0.25))), inDeck);   // planks along the hull
  // small cabin at the stern
  float cab = max(abs(q.x + 5.6) - 2.2, abs(q.y) - 2.0);
  col = mix(col, wood * 1.1 + 0.08, ss(aa, -aa, cab));
  col = mix(col, wood * 0.6, ss(aa, -aa, abs(cab + 0.5) - 0.3) * ss(aa, -aa, cab));
  float a = m;
  // bowsprit
  float bs = max(abs(q.y) - 0.4, max(q.x - 15.0, 10.0 - q.x));
  col = mix(col, vec3(0.32, 0.21, 0.12), ss(aa, -aa, bs));
  a = max(a, ss(aa, -aa, bs));
  // jib: from the bowsprit tip to the fore mast, bellied to leeward
  float ang = boom * 0.68 * sail;
  vec3 cloth = style == 3.0 ? vec3(0.99, 0.98, 0.95) : vec3(0.98, 0.94, 0.85);
  vec2 jb = sailD(q, vec2(13.5, 0.0), ang * 0.45, 7.5, 1.3 * sail);
  float jm = ss(aa, -aa, jb.x) * ss(0.02, 0.15, sail);
  col = mix(col, cloth * (0.84 + 0.18 * jb.y), jm);
  a = max(a, jm);
  // fore and main sail on their booms
  for (int k = 0; k < 2; k++) {
    vec2 mp = k == 0 ? vec2(5.5, 0.0) : vec2(0.5, 0.0);
    float Lb = k == 0 ? 5.8 : 9.5;
    vec2 sd = sailD(q, mp, ang, Lb, mix(0.15, k == 0 ? 2.4 : 3.8, sail));
    float sm = ss(aa, -aa, sd.x);
    vec3 sc = cloth * (0.80 + 0.22 * sd.y);                                                   // belly catches the light
    if (style == 2.0) sc = mix(sc, vec3(0.82, 0.25, 0.20), step(0.5, fract(-(rot(-ang) * (q - mp)).x / Lb * 2.0)) * 0.8 * sail);   // two-tone sails
    col = mix(col, sc, sm);
    // boom along the sail's foot and the mast
    vec2 r = rot(-ang) * (q - mp);
    col = mix(col, vec3(0.30, 0.20, 0.11), ss(aa, -aa, max(abs(r.y) - 0.33, max(-r.x - Lb, r.x))) * 0.9);
    col = mix(col, vec3(0.22, 0.14, 0.08), ss(aa, -aa, length(q - mp) - 0.9));
    a = max(a, sm);
  }
  // a pennant at the main mast top, streaming aft and fluttering gently
  vec3 flag = style < 1.0 ? vec3(0.86, 0.20, 0.17) : style < 2.0 ? vec3(0.98, 0.80, 0.22) : style < 3.0 ? vec3(0.95, 0.95, 0.92) : vec3(0.15, 0.55, 0.85);
  float fx = -(q.x - 0.5);
  float fy = q.y - 0.45 * sin(fx * 1.2 - t * 3.0) * ss(0.0, 2.0, fx);
  float fd = max(abs(fy) - 0.8 * (1.0 - fx / 4.5), max(-fx, fx - 4.5));
  float fm = ss(aa, -aa, fd);
  col = mix(col, flag, fm);
  a = max(a, fm);
  return vec4(col, a);
}
float shipShadow(vec2 q, float sail, float boom, float aa) {
  float d = hullD(q);
  float ang = boom * 0.68 * sail;
  vec2 o = vec2(-1.2, 1.6);                                 // sails stand higher: their shadow falls a little farther
  d = min(d, sailD(q - o, vec2(5.5, 0.0), ang, 5.8, mix(0.15, 2.6, sail)).x);
  d = min(d, sailD(q - o, vec2(0.5, 0.0), ang, 9.5, mix(0.15, 3.6, sail)).x);
  return ss(aa + 1.2, -aa - 0.6, d);
}

vec3 woodOf(float style) { return style < 1.0 ? vec3(0.42, 0.25, 0.13) : style < 2.0 ? vec3(0.62, 0.17, 0.12) : style < 3.0 ? vec3(0.13, 0.22, 0.36) : vec3(0.90, 0.88, 0.80); }
// one piece of a wrecked ship (q in piece space, divided by scale)
vec4 debrisCol(vec2 q, float type, float style, float aa) {
  vec3 wood = woodOf(style), c;
  float d;
  if (type < 1.5) {
    // a hull half with a splintered break
    vec2 h = q + vec2(type < 0.5 ? 5.5 : -4.0, 0.0);
    float brk = h.x - 0.6 - 0.55 * sin(h.y * 2.3 + 1.0) - 0.3 * sin(h.y * 5.1);
    d = max(hullD(h), type < 0.5 ? -brk : brk);
    c = wood * 0.8;
    float inDeck = ss(aa, -aa, d + 1.0);
    c = mix(c, vec3(0.80, 0.62, 0.40) * (0.92 + 0.08 * step(0.5, fract(h.y * 0.55 + 0.25))), inDeck);
    if (type > 0.5) c = mix(c, wood * 1.1 + 0.08, ss(aa, -aa, max(abs(h.x + 5.6) - 2.2, abs(h.y) - 2.0)));
    c = mix(c, vec3(0.86, 0.72, 0.50), ss(aa, -aa, abs(brk) - 0.45) * inDeck);          // raw splintered wood
  } else if (type < 2.5) {
    d = max(abs(q.x) - 3.4, abs(q.y) - 0.7);

vec3 vortexCol(vec3 col, vec2 p, vec4 f, vec4 fb) {

  float R = fb.x, r = length(d), str = f.w;
  if (r > R * 1.5 || str <= 0.0) return col;
  float rn = r / R, dir = fb.y;
  vec2 dr = rot(-fb.z) * d;                                  // frame turning with the water (textures stay with it)
  float a = atan(dr.y, dr.x);
  float n = N(dr + 400.0, 24.0).r;
  float band = ss(0.08, 0.3, rn) * (1.0 - ss(0.75, 1.3, rn));
  float ph = 3.0 * a + dir * 7.0 * log(r * 0.25 + 1.0);

  col = mix(col, FOAM, (1.0 - ss(0.0, 0.14, abs(rn - 1.0 - 0.1 * (n - 0.5)))) * str * 0.4);

// a splash: a broken foam ring racing out and a foamy patch in the middle, both fading
vec3 splashCol(vec3 col, vec2 p, vec4 f, vec4 fb, vec3 tint, float amt) {
  vec2 d = p - f.xy;
  float r = length(d), ph = f.w, sc = fb.x;
  if (r > 36.0 * sc) return col;
  float e = 1.0 - pow(1.0 - ph, 2.5);
  float n = N(d + fb.z * 300.0, 12.0).r;                     // fixed relative to the splash centre
  float R = (5.0 + 20.0 * e) * sc;
  float ring = 1.0 - ss(0.6 + 1.5 * e, 2.4 + 4.0 * e, abs(r - R - (n - 0.5) * 5.0));

// the white wake of ship i: its recent stern positions, the V spreading and fading with age
float wakeOf(vec2 p, int i) {
  vec4 b = uWakeBox[i];
  if (p.x < b.x || p.y < b.y || p.x > b.z || p.y > b.w) return 0.0;
  float acc = 0.0;
  vec4 a = texelFetch(uWake, ivec2(0, i), 0);
  if (a.z < 0.0) return 0.0;
  float br = N(p, 26.0).g;                                   // fixed in world space, like the wake itself
  for (int k = 1; k < WAKE_K; k++) {
    vec4 c = texelFetch(uWake, ivec2(k, i), 0);

/* ======================================================================

function resize() {

const T0 = performance.now();

let paused = false;
function frame(now) {

/* ======================================================================

let iconsSeen = !(WALL || PREVIEW);

function applySettings(v) {

addEventListener('resize', () => {
