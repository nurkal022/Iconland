<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconland · Old Land Map</title>
<!--
  Iconland · Old Land Map theme (an antique hand-inked map of a land of towns and roads; WebGL2, one full-screen pass)
  - Field (CPU, only when icons change, STEP grid): sP = signed distance to the clear "plain" around every icon
    cluster, sL = signed distance to a small lake around isolated icons (clusters of 1-2), d = distance to the
    nearest icon. Both are gaussian metaballs + a little noise warp, blended smoothly between icon layouts.
  - World (CPU, built once per seed / screen size / first icon layout and then kept): rivers, 5-9 towns at fixed
    places with names, a road network (minimum spanning tree + shortcuts), farm plots and region names. Towns never
    move; when icons come over a town later, the town (and its roads) simply fade out.
  - Ink layer (Canvas2D at device resolution, redrawn only when the field/settings change; two of them cross-fade
    with the field): forests of tree glyphs, mountain ranges, hills, tufts, rivers, dotted roads, towns and labels.
    Channels: R = ink, G = paper knock-out (erases what is behind a glyph), B = engraved shade.
  - Shader: parchment (mottling, tea stains, fibres, folds, burnt edges), the light plains with a stippled edge,
    inked lakes with waterlines, the ink layer, the compass rose (own texture), and the horse carriages.
  - Life: 2-3 covered wagons drawn by a horse travel the open roads from town to town, pausing in each town,
    turning smoothly to face the way they go. They are drawn in their own local coordinates (no screen-space
    sampling inside moving objects), so nothing flickers.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dcc79c; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.55); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="nogl">WebGL2 is not available.</div>
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 0;
const STEP = 5;
const MORPH_MS = 1800;
const S_CLAMP = 90, D_CLAMP = 600, I_CLAMP = 200;   // shader clamp of the plain / lake channels, CPU clamp, icon distance clamp
const ROSE = 72;                                      // compass rose radius (CSS px)

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');
const PREVIEW = QS.has('preview');
// Defaults must match themes.json
const P = {
  sigma: 50, forest: 0.65, details: 0.6, carriages: 1, speed: 1,
  quality: 2, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const KEYS = { sigma: [30, 110], forest: [0, 1], details: [0, 1], carriages: [0, 1], speed: [0, 3] };

/* ======================================================================
   Random / noise helpers (CPU)
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);

}

  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const h = (a, b) => { let v = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(k, 2246822519); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };

  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {

const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// terrain functions of the seed (static): forest cover, mountain ridges
const forestVal = (x, y) => fbm(x * 0.0042 + 3.1, y * 0.0042 - 1.7, 41);
const conVal = (x, y) => fbm(x * 0.006, y * 0.006, 47);
function mountVal(x, y) {
  const r = 1 - Math.abs(fbm(x * 0.0026, y * 0.0026, 31) - 0.47) * 3.4;     // ridges along a noise contour
  return Math.max(r, 0) * sstep(0.4, 0.56, fbm(x * 0.0019 + 9.0, y * 0.0019, 37));

/* ======================================================================
   Field (CPU): sP plain, sL lake (signed, <0 inside), d distance to the nearest icon
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {

    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0045, y * 0.0045, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0045, y * 0.0045, 2) - 0.47;
    NZ.fn[i] = fbm(x * 0.02, y * 0.02, 3) - 0.47;

// icons closer than this (gap, px) belong to one cluster; clusters of 1-2 icons sit in a lake
function lakeFlags(rects) {
  const n = rects.length, par = rects.map((_, i) => i);
  const find = i => { while (par[i] !== i) i = par[i] = par[par[i]]; return i; };
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = rects[i], b = rects[j];
    if (Math.abs(a.cx - b.cx) - a.hw - b.hw < 44 && Math.abs(a.cy - b.cy) - a.hh - b.hh < 44) par[find(i)] = find(j);
  }

let fieldMs = 0;
function computeField(rects) {
  const t0 = performance.now();
  const N = Gw * Gh, fP = new Float32Array(N), fL = new Float32Array(N), d = new Float32Array(N).fill(I_CLAMP);
  const sigL = P.sigma, sigP = P.sigma * 1.3 + 12, isP = 1 / (sigP * sigP), isL = 1 / (sigL * sigL);
  const wa = 34, lake = lakeFlags(rects);

    const R = Math.max(Rf, I_CLAMP) + Math.max(r.hw, r.hh) + wa;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5, isLake = lake[ri];
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
      const qx = x + NZ.wx[i] * wa, qy = y + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      const d2 = dx * dx + dy * dy;
      if (d2 < Rf2) fP[i] += Math.exp(-d2 * isP);
      if (isLake && d2 < RL2) fL[i] += Math.exp(-d2 * isL);
      let ex = Math.abs(x - r.cx) - r.hw - 4, ey = Math.abs(y - r.cy) - r.hh - 2;
      if (ex < 0) ex = 0; if (ey < 0) ey = 0;

    }

  for (let i = 0; i < N; i++) {
    let g = Math.log(Math.max(fP[i], fMin));
    sP[i] = Math.min(D_CLAMP, sigP * (Math.sqrt(Math.max(-g, 0)) - c0) - sigP * 0.6 * Math.max(g, 0) + NZ.fn[i] * 26);
    g = Math.log(Math.max(fL[i], fMin));
    sL[i] = Math.min(D_CLAMP, sigL * (Math.sqrt(Math.max(-g, 0)) - c0) - sigL * 0.6 * Math.max(g, 0) + NZ.fl[i] * 40);

  return { sP, sL, d };
}
function blankField() {
  const N = Gw * Gh;
  return { sP: new Float32Array(N).fill(-S_CLAMP), sL: new Float32Array(N).fill(S_CLAMP), d: new Float32Array(N).fill(I_CLAMP), blank: true, alive: [], open: [], regAlive: [], compass: null };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ======================================================================
   World (constant per seed / screen size / first icon layout): rivers, towns, roads, plots, region names
   ====================================================================== */
const TOWN_NAMES = ['Ventiro', 'Pontalba', 'Rocavia', 'Silvarna', 'Fontebrina', 'Lumeria', 'Corvenna', 'Orsavia', 'Mirandel',
  'Caldoria', 'Sanctum Ilicis', 'Pons Ferreus', 'Vicus Ursi', 'Arx Lucida', 'Brennica', 'Tolvesca', 'Aquavella', 'Castrum Nivis'];
const REGION_NAMES = ['SALTUS MAGNUS', 'MARCHIA OCCIDUA', 'AGRI SERENI', 'VALLES TACITAE', 'DUCATUS ALBUS', 'SILVAE ANTIQUAE', 'PLANITIES LATA', 'COLLES RUBRI'];
let WORLD = null, worldMs = 0;
const TS = 1.4;      // town drawing scale
function shuffled(list, k) { return list.map((v, i) => [hash2(i, 7, k), v]).sort((a, b) => a[0] - b[0]).map(e => e[1]); }

function walkRiver(x, y, h0, len, k) {
  const pts = [[x, y]];
  let s = 0;
  while (s < len) {
    const hd = h0 + (fbm(s * 0.0045, k * 3.1, 600 + k) - 0.47) * 3.2 + (fbm(s * 0.024, k * 5.7, 640 + k) - 0.47) * 1.8;
    x += Math.cos(hd) * 5; y += Math.sin(hd) * 5; s += 5;
    pts.push([x, y]);
    if (x < -24 || y < -24 || x > W + 24 || y > H + 24) break;
  }
  return pts;
}
function polyLen(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));

}
function bez(a, c, b, t) {

function buildWorld(F0) {

    const gx0 = Math.max(0, Math.floor((x - r) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((x + r) / STEP));
    const gy0 = Math.max(0, Math.floor((y - r) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((y + r) / STEP));
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++)
      if ((gx * STEP - x) ** 2 + (gy * STEP - y) ** 2 <= r * r) ko[gy * Gw + gx] = 1;
  };
  const stampRect = (x0, y0, x1, y1) => {
    for (let gy = Math.max(0, Math.floor(y0 / STEP)); gy <= Math.min(Gh - 1, Math.ceil(y1 / STEP)); gy++)
      for (let gx = Math.max(0, Math.floor(x0 / STEP)); gx <= Math.min(Gw - 1, Math.ceil(x1 / STEP)); gx++) ko[gy * Gw + gx] = 1;
  };

  // ---- rivers: one from the top edge (with a tributary), sometimes a second one from a side ----
  const rivers = [];

    if (pts.length < 12) return;
    const n = pts.length;
    rivers.push(pts.map((q, i) => [q[0], q[1], w0 + (w1 - w0) * (i / (n - 1))]));
  };
  {
    const h = hash2(1, 1, 500);
    const main = walkRiver(W * (0.18 + 0.64 * h), -12, Math.PI / 2 + (hash2(2, 1, 500) - 0.5) * 0.7, Math.max(W, H) * 2.2, 1);
    addRiver(main, 1.4, 5.0);
    if (main.length > 60) {
      const j = Math.floor(main.length * (0.42 + 0.2 * hash2(3, 1, 500)));
      const a = main[j], b = main[Math.min(j + 3, main.length - 1)];
      const dir = Math.atan2(b[1] - a[1], b[0] - a[0]) + Math.PI + (hash2(4, 1, 500) < 0.5 ? 1 : -1) * 0.95;
      const trib = walkRiver(a[0], a[1], dir, 200 + 180 * hash2(5, 1, 500), 2).reverse();

      if (trib.length > 12) rivers.push(trib.map((q, i) => [q[0], q[1], 0.8 + (w * 0.6 - 0.8) * (i / (trib.length - 1))]));
    }

      const left = hash2(7, 1, 500) < 0.5;
      addRiver(walkRiver(left ? -12 : W + 12, H * (0.3 + 0.45 * hash2(8, 1, 500)), left ? 0.1 : Math.PI - 0.1, Math.max(W, H) * 2, 3), 0.9, 3.2);

  towns.forEach((t, i) => {

        for (let t = 0; t < n; t++) if (t !== ia && t !== ib && Math.hypot(q[0] - towns[t].x, q[1] - towns[t].y) < 40) cost += 200;
      }

    if (kind === 1) drawMountain(x, cx, cy, s, h);
    else if (kind === 2) drawHill(x, cx, cy, s);
    else if (kind === 3) drawConifer(x, cx, cy, s, h);
    else if (kind === 4) drawRoundTree(x, cx, cy, s, h);
    else drawTuft(x, cx, cy, s);
  }
  // ---- farm plots of the visible towns ----
  for (const pl of Wd.plots) {
    if (!F.alive[pl.town]) continue;
    x.save(); x.translate(pl.x, pl.y); x.rotate(pl.rot);
    x.strokeStyle = inkC(150); x.lineWidth = 0.6;
    x.strokeRect(-pl.w / 2, -pl.h / 2, pl.w, pl.h);
    x.beginPath();
    if (pl.kind === 0) for (let yy = -pl.h / 2 + 2; yy < pl.h / 2 - 0.5; yy += 2) { x.moveTo(-pl.w / 2 + 1, yy); x.lineTo(pl.w / 2 - 1, yy); }
    x.stroke();
    if (pl.kind === 1) {
      x.fillStyle = inkC(170);
      for (let yy = -pl.h / 2 + 2; yy < pl.h / 2 - 1; yy += 2.6) for (let xx = -pl.w / 2 + 2; xx < pl.w / 2 - 1; xx += 2.4) x.fillRect(xx - 0.45, yy - 0.45, 0.9, 0.9);
    }
    x.restore();
  }
  // ---- rivers: ink banks, then the water knocked out between them (skipped right next to the icons) ----
  const runs = [];
  for (const r of Wd.rivers) {
    let cur = [];
    for (const q of r) {
      if (sampleArr(F.d, q[0], q[1]) > 12 + q[2]) cur.push(q);
      else { if (cur.length > 1) runs.push(cur); cur = []; }
    }
    if (cur.length > 1) runs.push(cur);
  }
  const strokeRuns = (extra, col, op) => {
    x.globalCompositeOperation = op; x.strokeStyle = col;
    for (const run of runs) for (let i = 0; i < run.length - 1; i += 4) {
      const j = Math.min(i + 5, run.length - 1);
      x.lineWidth = run[i][2] + extra;
      x.beginPath(); x.moveTo(run[i][0], run[i][1]);
      for (let m = i + 1; m <= j; m++) x.lineTo(run[m][0], run[m][1]);
      x.stroke();
    }
  };
  strokeRuns(2.0, C_INK, 'source-over');
  strokeRuns(0, C_KO, 'source-over');
  x.globalCompositeOperation = 'lighter';
  // a faint flow line in the wider parts
  x.strokeStyle = inkC(70); x.lineWidth = 0.45; x.setLineDash([6, 9]);
  for (const run of runs) {
    x.beginPath(); let on = false;
    for (const q of run) { if (q[2] > 2.6) { if (!on) { x.moveTo(q[0], q[1]); on = true; } else x.lineTo(q[0], q[1]); } }
    x.stroke();
  }
  x.setLineDash([]);
  // ---- dotted roads ----
  x.strokeStyle = inkC(215); x.lineWidth = 1.05; x.setLineDash([2.6, 3.4]);
  Wd.roads.forEach((r, i) => {
    if (!F.open[i]) return;
    const A = Wd.towns[r.a], B = Wd.towns[r.b];
    x.beginPath(); let on = false;
    for (const q of r.pts) {
      if (Math.hypot(q[0] - A.x, q[1] - A.y) < 22 || Math.hypot(q[0] - B.x, q[1] - B.y) < 22) { on = false; continue; }
      if (!on) { x.moveTo(q[0], q[1]); on = true; } else x.lineTo(q[0], q[1]);
    }
    x.stroke();
  });
  x.setLineDash([]);
  // ---- towns and their names ----
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  Wd.towns.forEach((t, i) => {
    if (!F.alive[i]) return;
    x.save(); x.translate(t.x, t.y); x.scale(TS, TS);
    for (const b of t.b) drawBuilding(x, 0, 0, b);
    x.strokeStyle = inkC(120); x.lineWidth = 0.45; x.beginPath();
    x.moveTo(-(t.big ? 19 : 15), 3.6); x.lineTo(t.big ? 19 : 15, 3.6); x.stroke();
    x.restore();
    // a light cartouche behind the name: erases road dots / trees under the letters
    x.globalCompositeOperation = 'source-over'; x.fillStyle = 'rgb(0,90,0)';
    x.fillRect(t.x - t.lw / 2 - 3, t.y + t.labDy - 12, t.lw + 6, 16);
    x.font = 'italic 14px Georgia, "Times New Roman", serif';
    x.globalCompositeOperation = 'source-over'; x.strokeStyle = C_KO; x.lineWidth = 3.5; x.strokeText(t.name, t.x, t.y + t.labDy);
    x.globalCompositeOperation = 'lighter'; x.fillStyle = inkC(240); x.fillText(t.name, t.x, t.y + t.labDy);
  });
  // ---- region names (spaced capitals) ----
  x.font = '600 15px Georgia, "Times New Roman", serif';
  Wd.regions.forEach((r, i) => {
    if (!F.regAlive[i]) return;
    const ch = [...r.text], step = r.w / ch.length;
    ch.forEach((c, j) => {
      const cx = r.x - r.w / 2 + (j + 0.5) * step;
      x.globalCompositeOperation = 'source-over'; x.strokeStyle = C_KO; x.lineWidth = 3; x.strokeText(c, cx, r.y + 5);
      x.globalCompositeOperation = 'lighter'; x.fillStyle = inkC(185); x.fillText(c, cx, r.y + 5);
    });
  });
  x.globalCompositeOperation = 'source-over';
  ovMs = performance.now() - t0;
}

/* ---------- two field textures (RGBA16F: plain, lake, icon distance) + two ink layers ---------- */
const ftex = [null, null], otex = [null, null], slotF = [null, null];
let fromI = 0, toI = 0, FA = null, FB = null;
let morphT0 = -1e9, morphDur = MORPH_MS, curMix = 1;
function allocField() {
  for (let i = 0; i < 2; i++) {
    if (ftex[i]) gl.deleteTexture(ftex[i]);
    ftex[i] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, Gw, Gh, 0, gl.RGBA, gl.HALF_FLOAT, null);
    texParams(gl.CLAMP_TO_EDGE, false);
    if (!otex[i]) otex[i] = gl.createTexture();
    slotF[i] = null;
  }
}
function uploadOverlay(i, Fd) {
  renderOverlay(Fd);
  gl.bindTexture(gl.TEXTURE_2D, otex[i]);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ovCanvas);
  texParams(gl.CLAMP_TO_EDGE, false);
}
// ink layer currently on screen = mix(from, to, m): blended on the GPU into the spare texture, which becomes slot i
const BLIT = `#version 300 es
precision highp float;
uniform sampler2D uA, uB;
uniform float uM;
uniform vec2 uSize;
out vec4 o;
void main() { vec2 uv = gl_FragCoord.xy / uSize; o = mix(texture(uA, uv), texture(uB, uv), uM); }`;
let BP = null, fbo = null, spare = null;
function blendOverlay(i, m) {
  if (!BP) { BP = program(BLIT); fbo = gl.createFramebuffer(); }
  if (!spare) spare = gl.createTexture();
  const w = ovCanvas.width, h = ovCanvas.height;
  gl.bindTexture(gl.TEXTURE_2D, spare);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  texParams(gl.CLAMP_TO_EDGE, false);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, spare, 0);
  gl.viewport(0, 0, w, h);
  gl.useProgram(BP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, otex[fromI]); gl.uniform1i(BP.U.uA, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, otex[toI]); gl.uniform1i(BP.U.uB, 1);
  gl.uniform1f(BP.U.uM, m); gl.uniform2f(BP.U.uSize, w, h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const old = otex[i]; otex[i] = spare; spare = old;
}
function uploadField(i, Fd, blendM) {
  const n = Gw * Gh, d = new Uint16Array(n * 4);
  for (let k = 0; k < n; k++) {
    d[k * 4] = toHalf(Math.max(-S_CLAMP, Math.min(Fd.sP[k], S_CLAMP)));
    d[k * 4 + 1] = toHalf(Math.max(-S_CLAMP, Math.min(Fd.sL[k], S_CLAMP)));
    d[k * 4 + 2] = toHalf(Fd.d[k]);
  }
  gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, Gw, Gh, gl.RGBA, gl.HALF_FLOAT, d);
  if (blendM !== undefined && otex[fromI] && otex[toI]) blendOverlay(i, blendM);
  else uploadOverlay(i, Fd);
  slotF[i] = Fd;
}

let icons = [];
const iconRects = () => icons.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2 - 4, hh: ic.h / 2 - 2 }));
// Field currently on screen (from -> to blended by curMix): a new transition must start from it, not from the
// previous target, or the scenery jumps when icons move again while a transition is still running.
function blendFields(A, B, m) {
  const out = {};
  for (const k in B) {
    const a = A && A[k], b = B[k];
    if (!(b instanceof Float32Array)) continue;                  // towns / roads / compass are rebuilt below
    if (!(a instanceof Float32Array) || a.length !== b.length) return null;
    const r = new Float32Array(b.length);
    if (k === 'sP' || k === 'sL') {   // blend what the shader blends: the clamped channels
      const C = S_CLAMP, cl = v => v > C ? C : v < -C ? -C : v;
      for (let i = 0; i < b.length; i++) { const x = cl(a[i]); r[i] = x + (cl(b[i]) - x) * m; }
    } else for (let i = 0; i < b.length; i++) r[i] = a[i] + (b[i] - a[i]) * m;
    out[k] = r;
  }
  if (!out.sP) return null;
  // its ink layer is blended on the GPU (blendOverlay); visibility flags from the blend, compass: the more visible one
  derive(out, null);
  out.compass = m < 0.5 ? A.compass : B.compass;
  return out;
}
function commit(fromEmpty = false) {
  const nf = computeField(iconRects());
  if (fromEmpty || !WORLD) { buildWorld(nf); resetCars(); }
  derive(nf, FB);
  const target = 1 - toI;
  if (fromEmpty) { FA = blankField(); FA.compass = nf.compass; uploadField(toI, FA); }
  else if (FA && FB && curMix < 0.999 && (FA = blendFields(FA, FB, Math.max(0, curMix)))) uploadField(toI, FA, Math.max(0, curMix));
  else FA = FB || nf;
  FB = nf;
  uploadField(target, FB);
  fromI = toI; toI = target;
  morphT0 = performance.now();
  morphDur = fromEmpty ? 2600 : MORPH_MS;
  curMix = 0;
}
function refresh() {
  if (iconsSeen) { FB = computeField(iconRects()); buildWorld(FB); derive(FB, null); }
  else FB = blankField();
  FA = FB;
  uploadField(toI, FB);
  fromI = toI; morphT0 = -1e9; curMix = 1;
  resetCars();
}

/* ======================================================================
   Life: horse carriages on the open roads
   ====================================================================== */
const carU = new Float32Array(MAX_CARS * 4), carBU = new Float32Array(MAX_CARS * 4);
let cars = [], spawnT = 1.5;
function resetCars() { cars = []; spawnT = 1.5; }
function roadAt(r, t) {
  t = Math.min(Math.max(t, 0), r.len);
  let lo = 1, hi = r.cum.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (r.cum[m] < t) lo = m + 1; else hi = m; }
  const i = lo, a = r.pts[i - 1], b = r.pts[i], seg = r.cum[i] - r.cum[i - 1] || 1, u = (t - r.cum[i - 1]) / seg;
  // a smoother tangent over a few points
  const p0 = r.pts[Math.max(0, i - 3)], p1 = r.pts[Math.min(r.pts.length - 1, i + 2)];
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, p1[0] - p0[0], p1[1] - p0[1]];
}
const END = 34;     // carriages stop this far from a town's centre
function openRoads() { return FB && FB.open ? WORLD.roads.map((r, i) => i).filter(i => FB.open[i]) : []; }
function spawnCar() {
  const open = openRoads().filter(i => !cars.some(c => c.road === i));
  if (!open.length) return false;
  const ri = open[Math.floor(Math.random() * open.length)], r = WORLD.roads[ri];
  const dir = Math.random() < 0.5 ? 1 : -1;
  const c = { road: ri, dir, t: dir > 0 ? END : r.len - END, wait: 1 + Math.random() * 2, alpha: 0, out: false,
    x: 0, y: 0, ang: 0, face: 1, faceS: 1, gait: Math.random() * 6, wheel: 0, init: false };
  cars.push(c);
  return true;
}
function stepLife(t, dt) {
  const show = P.carriages >= 0.5 && WORLD && FB && !FB.blank;
  const open = show ? openRoads() : [];
  const want = show ? Math.min(open.length >= 5 ? 3 : 2, open.length) : 0;
  // fade out the extra ones, or those whose road closed (an icon came over it)
  let active = 0;
  for (const c of cars) { if (!show || !FB.open[c.road]) c.out = true; if (!c.out && ++active > want) c.out = true; }
  if (active < want && curMix > 0.99) {
    spawnT -= dt;
    if (spawnT <= 0) { spawnCar(); spawnT = 5 + Math.random() * 6; }
  }
  for (const c of cars) {
    const r = WORLD && WORLD.roads[c.road];
    if (!r) { c.alpha = 0; c.out = true; continue; }
    c.alpha = c.out ? Math.max(0, c.alpha - dt / 1.2) : Math.min(1, c.alpha + dt / 1.5);
    let moving = false;
    if (c.wait > 0) {
      c.wait -= dt;
      if (c.wait <= 0 && !c.out) {
        // in town: take another open road from here (not the same one if there is a choice), else turn back
        const town = c.dir > 0 ? r.b : r.a;
        const opts = openRoads().filter(i => i !== c.road && (WORLD.roads[i].a === town || WORLD.roads[i].b === town) && !cars.some(o => o !== c && o.road === i && !o.out));
        if (opts.length && Math.random() < 0.8) {
          const ni = opts[Math.floor(Math.random() * opts.length)], nr = WORLD.roads[ni];
          c.road = ni; c.dir = nr.a === town ? 1 : -1; c.t = c.dir > 0 ? END : nr.len - END;
        } else c.dir = -c.dir;
      }
    } else {
      const v = 9;
      c.t += c.dir * v * dt; moving = true;
      c.gait += dt * 5.5; c.wheel += dt * v / 2.7;
      if (c.t <= END || c.t >= r.len - END) { c.t = Math.min(Math.max(c.t, END), r.len - END); c.wait = 3 + Math.random() * 4; }
    }
    const rr = WORLD.roads[c.road], q = roadAt(rr, c.t);
    const vx = q[2] * c.dir, vy = q[3] * c.dir, vl = Math.hypot(vx, vy) || 1;
    if (Math.abs(vx) > 0.25 * vl) c.face = vx > 0 ? 1 : -1;
    // turn smoothly: the side view squashes through zero when it flips, the tilt follows the road gently
    const k = Math.min(1, dt * 2.2);
    c.faceS += Math.max(-dt * 1.6, Math.min(dt * 1.6, c.face - c.faceS));
    let ta = Math.atan2(vy * c.face, vx * c.face);
    ta = Math.max(-0.38, Math.min(0.38, ta));
    if (!c.init) { c.ang = ta; c.faceS = c.face; c.init = true; }
    c.ang += (ta - c.ang) * k;
    c.x = q[0]; c.y = q[1] + 1;
    if (!moving) c.gait += 0;
  }
  cars = cars.filter(c => !(c.out && c.alpha <= 0));
  carU.fill(0); carBU.fill(0);
  cars.slice(0, MAX_CARS).forEach((c, i) => {
    carU.set([c.x, c.y, c.ang, c.alpha], i * 4);
    carBU.set([c.faceS, c.gait, c.wheel, 0], i * 4);
  });
}

/* ======================================================================
   Frame loop
   ====================================================================== */
function resize() {
  W = innerWidth; H = innerHeight;
  const scale = PREVIEW ? 0.45 : Math.min(devicePixelRatio || 1, P.quality);
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
  buildCompass();
  WORLD = null;
  resetCars();
}

const T0 = performance.now();
let lastT = 0, fpsEMA = 0, frameN = 0, frameMs = 0, lifeT = 0;
let paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 31) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  if (lastT) fpsEMA = fpsEMA ? fpsEMA * 0.9 + (1 / dt) * 0.1 : 1 / dt;
  lastT = now;
  const sdt = dt * P.speed;
  lifeT += sdt;
  stepLife(lifeT, sdt);
  draw(now);
  frameN++;
}
function draw(now) {
  const t0 = performance.now();
  const e = Math.min(Math.max((now - morphT0) / morphDur, 0), 1);
  curMix = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  const { p, U } = PR;
  gl.useProgram(p);
  gl.viewport(0, 0, cv.width, cv.height);
  const tex = [noiseTex, ftex[fromI], ftex[toI], otex[fromI], otex[toI], compTex];
  ['uNoise', 'uFA', 'uFB', 'uOA', 'uOB', 'uComp'].forEach((nm, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex[i]); gl.uniform1i(U[nm], i);
  });
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);
  gl.uniform2f(U.uCv, cv.width, cv.height);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (seed % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  const ca = slotF[fromI] && slotF[fromI].compass, cb = slotF[toI] && slotF[toI].compass;
  const same = ca && cb && Math.abs(ca.x - cb.x) + Math.abs(ca.y - cb.y) + Math.abs(ca.r - cb.r) < 0.5;
  gl.uniform4f(U.uCompA, ca ? ca.x : 0, ca ? ca.y : 0, ca ? ca.r : 1, ca && !same ? 1 - curMix : 0);
  gl.uniform4f(U.uCompB, cb ? cb.x : 0, cb ? cb.y : 0, cb ? cb.r : 1, cb ? (same ? 1 : curMix) : 0);
  gl.uniform4fv(U.uCar, carU);
  gl.uniform4fv(U.uCarB, carBU);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frameMs = performance.now() - t0;
}

/* ======================================================================
   Settings / hosted mode
   ====================================================================== */
let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise();
  if (!iconsSeen) { refresh(); return; }
  commit(true);
}
function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, over = false;
  for (const k in v) {
    if (!KEYS[k] || typeof v[k] !== 'number' || !isFinite(v[k]) || P[k] === v[k]) continue;
    const [lo, hi] = KEYS[k];
    P[k] = Math.min(Math.max(v[k], lo), hi);
    if (k === 'sigma') field = true;
    if (k === 'forest' || k === 'details') over = true;
  }
  if (field && FB && !FB.blank) commit();             // plain / lake size: smooth transition (towns stay put)
  else if (over) for (let i = 0; i < 2; i++) if (slotF[i]) uploadOverlay(i, slotF[i]);
}
function drawGhosts() {
  const box = document.getElementById('ghosts');
  if (box) box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  refresh();                                     // blank parchment until we know where the icons are
  let first = true;
  const handle = m => {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;
    icons = m.vis && Array.isArray(m.r) ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);                                // first time: the map draws itself in; later: smooth transition
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) { try { handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); } catch (e) {} } });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => { try { handle(JSON.parse(ev.data)); } catch (e) { console.error(e); } });
  host.postMessage('ready');
}
function startDemo() {
  const list = [];
  for (let r = 0; r < 6; r++) list.push({ x: W - 90, y: 10 + r * 100, w: 76, h: 92 });
  list.push({ x: W * 0.22, y: H * 0.3, w: 76, h: 92 }, { x: W * 0.45, y: H * 0.62, w: 76, h: 92 }, { x: W * 0.52, y: H * 0.18, w: 76, h: 92 });
  icons = list;
  commit(true);
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); refresh(); }, 100);
});

window.__dbg = { P, stats: () => ({ fieldMs, ovMs, worldMs, frameMs, fps: fpsEMA, towns: WORLD && WORLD.towns.length, roads: WORLD && WORLD.roads.length, cars: cars.map(c => [Math.round(c.x), Math.round(c.y), c.wait > 0 ? 'w' : 'm']) }) };
resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else startDemo();
